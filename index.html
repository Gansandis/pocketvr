<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>PocketVR</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10121a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;touch-action:manipulation}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
video{position:fixed;left:-10px;top:0;width:2px;height:2px;pointer-events:none}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#0b1220;z-index:5;text-align:center;padding:20px}
#start button{font-size:20px;padding:14px 36px;border-radius:30px;border:0;background:#4f8cff;color:#fff;cursor:pointer}
#start p{margin:0;opacity:.85;line-height:1.5}
#hud{position:fixed;left:8px;top:6px;font:11px monospace;opacity:.75;z-index:3;white-space:pre;pointer-events:none;text-shadow:0 1px 2px #000}
#web{position:fixed;left:6%;right:6%;top:5%;bottom:5%;z-index:4;display:flex;flex-direction:column;background:#1e1e21;border-radius:18px;overflow:hidden;touch-action:auto;box-shadow:0 0 0 2px #3a3a3f}
#web[hidden]{display:none}
#wbar{display:flex;gap:6px;padding:6px;align-items:center;background:#2a2a2e}
#wbar button{border:0;border-radius:12px;background:#3d3d43;color:#fff;font-size:18px;min-width:44px;height:40px}
#wbar button:active{background:#5a5a64}
#wurl{flex:1;min-width:0;height:40px;border:0;border-radius:12px;background:#111;color:#fff;padding:0 12px;font-size:15px}
#wframe{flex:1;border:0;background:#fff;touch-action:auto}
</style>
</head>
<body>
<div id="start">
  <h2 style="margin:0">PocketVR v4.0</h2>
  <p>หมุนจอเป็นแนวนอน แล้วกดเริ่ม<br>รองรับจอหลายหน้าต่าง, วิดีโอ 360°, ปัดมือเลื่อนหน้า และสองมือซูม</p>
  <button id="go">เริ่มใช้งาน</button>
  <p id="msg" style="font-size:13px"></p>
</div>
<div id="hud"></div>
<div id="web" hidden>
  <div id="wbar">
    <button id="wh" title="หน้าแรกของเว็บนี้">⌂</button>
    <input id="wurl" type="text" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false">
    <button id="wgo">ไป</button>
    <button id="wx" title="เปิดในแท็บใหม่">↗</button>
    <button id="wc" title="ปิด">✕</button>
  </div>
  <iframe id="wframe" referrerpolicy="no-referrer" allow="fullscreen; autoplay; clipboard-write" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"></iframe>
</div>
<video id="cam" playsinline muted autoplay></video>
<video id="vid360" playsinline loop crossorigin="anonymous"></video>
<input id="file360" type="file" accept="video/*" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
<script type="module">
import {HandLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const VERSION = 'v4.0';
const $ = id => document.getElementById(id);
const hud = $('hud'), video = $('cam'), vid360 = $('vid360'), file360 = $('file360');
const BG = 0x0b1220;
const IPDS = [0.058, 0.063, 0.068];
const QUAL = [0.75, 1, 1.5], QNAMES = ['ประหยัด', 'ปกติ', 'คมชัด'];
const S = {mr:false, stereo:false, ipd:0.063, mode:'home', tab:'all', score:0, cam:false, qi:1, pscale:1.15, page:0};

/* --- dark-room support --- */
const NMODES = ['ปิด', 'อัตโนมัติ', 'สว่างสุด'], TMODES = ['ปิด', 'เปิด', 'อัตโนมัติ'];
const N = {mode:1, tm:0, lum:128, gain:1, gainT:1, dark:false, boosting:false, warn:false,
           torchOK:false, torchOn:false, ev:0, expCap:null, track:null, lastProbe:0, drawnVT:-1,
           pending:null, swallow:false, webOpen:false, webUrl:'', msg:'', msgUntil:0};
const HAS_FILTER = 'filter' in CanvasRenderingContext2D.prototype;
const probeCv = document.createElement('canvas'); probeCv.width = 32; probeCv.height = 18;
const probeCtx = probeCv.getContext('2d', {willReadFrequently:true});
const boostCv = document.createElement('canvas'); boostCv.width = 960; boostCv.height = 540;
const bctx = boostCv.getContext('2d');
let boostTex = null;

/* --- phone apps & web shortcuts --- */
const APPS = [
  {n:'YouTube',     i:'▶️', pkg:'com.google.android.youtube',      link:'https://www.youtube.com/'},
  {n:'Spotify',     i:'🎵', pkg:'com.spotify.music',               link:'spotify://'},
  {n:'LINE',        i:'💬', pkg:'jp.naver.line.android',           link:'line://'},
  {n:'Facebook',    i:'📘', pkg:'com.facebook.katana',             link:'fb://'},
  {n:'Messenger',   i:'✉️', pkg:'com.facebook.orca',               link:'fb-messenger://'},
  {n:'Instagram',   i:'📷', pkg:'com.instagram.android',           link:'https://www.instagram.com/'},
  {n:'TikTok',      i:'🎬', pkg:'com.zhiliaoapp.musically',        link:'https://www.tiktok.com/'},
  {n:'Netflix',     i:'🍿', pkg:'com.netflix.mediaclient',         link:'https://www.netflix.com/'},
  {n:'Google Maps', i:'🗺', pkg:'com.google.android.apps.maps',    link:'https://maps.google.com/'},
  {n:'Discord',     i:'🎧', pkg:'com.discord',                     link:'https://discord.com/'}
];
const WEBS = [
  {n:'Wikipedia ไทย', i:'📚', url:'https://th.wikipedia.org/', topic:'ประเทศไทย'},
  {n:'ดาราศาสตร์ VR', i:'🪐', url:'https://th.wikipedia.org/wiki/ดาราศาสตร์', topic:'ดาราศาสตร์'},
  {n:'เทคโนโลยี VR',  i:'🥽', url:'https://th.wikipedia.org/wiki/ความเป็นจริงเสมือน', topic:'ความเป็นจริงเสมือน'},
  {n:'แผนที่ OSM',    i:'🗺', url:'https://www.openstreetmap.org/export/embed.html?bbox=100.45%2C13.65%2C100.65%2C13.85&layer=mapnik'},
  {n:'DuckDuckGo',    i:'🔎', url:'https://html.duckduckgo.com/html/'}
];
const BLOCKED_SCHEMES = /^(javascript|data|file|blob|about|vbscript):/i;
function loadList(k){ try{ const v = JSON.parse(localStorage.getItem(k) || '[]'); return Array.isArray(v) ? v : []; }catch(e){ return []; } }
function saveList(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let customApps = loadList('pvr_apps'), customWebs = loadList('pvr_webs');

/* --- tunables --- */
const PINCH_SETS = [[0.18, 0.30, 'แน่น'], [0.22, 0.34, 'กลาง'], [0.28, 0.42, 'หลวม']];
const SMOOTH = [[2.5, 4, 'ไว'], [1.2, 3, 'กลาง'], [0.6, 2.5, 'นุ่ม']];
const RATE_MS = [33, 50, 80], RATE_N = ['เร็ว', 'กลาง', 'ประหยัด'];
const GAZE_N = ['ปิด', 'เปิด', 'เฉพาะแบ่งจอ'], PTR_N = ['ปลายนิ้วชี้', 'กึ่งกลางนิ้วจีบ'], DEV_N = ['GPU', 'CPU'];
const LOST_MS = 650;
const HOLD_R = 0.45;
const HIT_SLOP = 8;
const HAND_D = 1.1;
const PANEL_R = 2.2, DOCK_R = 2.0, WIN_R = 2.05;
const BASE_W = 2.0, BASE_H = 1.1;
const PS_MIN = 0.6, PS_MAX = 2.2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* --- saved preferences --- */
const P = {gaze:0, ptr:0, smooth:1, rate:1, pinch:1, dev:0, swipe:1, twoZoom:1};
function loadPrefs(){
  try{
    const o = JSON.parse(localStorage.getItem('pvr_prefs') || '{}');
    for (const k of Object.keys(P)) if (Number.isInteger(o[k]) && o[k] >= 0) P[k] = o[k];
    P.gaze = Math.min(P.gaze, 2); P.ptr = Math.min(P.ptr, 1); P.smooth = Math.min(P.smooth, 2);
    P.rate = Math.min(P.rate, 2); P.pinch = Math.min(P.pinch, 2); P.dev = Math.min(P.dev, 1);
    P.swipe = Math.min(P.swipe, 1); P.twoZoom = Math.min(P.twoZoom, 1);
    if (Number.isInteger(o.qi) && o.qi >= 0) S.qi = Math.min(o.qi, 2);
    if (Number.isInteger(o.nm) && o.nm >= 0) N.mode = Math.min(o.nm, 2);
    if (IPDS.includes(o.ipd)) S.ipd = o.ipd;
  }catch(e){}
}
function savePrefs(){
  try{ localStorage.setItem('pvr_prefs', JSON.stringify(Object.assign({}, P, {qi:S.qi, nm:N.mode, ipd:S.ipd}))); }catch(e){}
}
loadPrefs();

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 6, 22);
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 60);
scene.add(camera);
const stereo = new THREE.StereoCamera();

scene.add(new THREE.HemisphereLight(0xffffff, 0x334466, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(1, 2, 1); scene.add(sun);

const env = new THREE.Group(); scene.add(env);
const grid = new THREE.GridHelper(30, 30, 0x4f8cff, 0x1c2b4a); grid.position.y = -1.6; env.add(grid);

const heading = new THREE.Group(); scene.add(heading);
const groups = {shoot:new THREE.Group(), gallery:new THREE.Group(), vr360:new THREE.Group()};
Object.values(groups).forEach(g => { g.visible = false; heading.add(g); });

function applyQuality(){
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, QUAL[S.qi]));
  resize();
}

/* ---------- canvas UI toolkit ---------- */
function roundRect(x, a, b, w, h, r){
  x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r);
  x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath();
}
function wrapText(ctx, text, maxWidth){
  const words = text.split(/(\s+)/);
  const lines = [];
  let cur = '';
  for (const w of words){
    if (ctx.measureText(cur + w).width > maxWidth && cur.length > 0){
      lines.push(cur.trim());
      cur = w.trimStart();
    } else {
      cur += w;
    }
  }
  if (cur.trim()) lines.push(cur.trim());
  // fallback for long Thai strings without spaces
  const finalLines = [];
  for (const line of lines){
    if (ctx.measureText(line).width <= maxWidth){ finalLines.push(line); continue; }
    let sub = '';
    for (const ch of line){
      if (ctx.measureText(sub + ch).width > maxWidth){ finalLines.push(sub); sub = ch; }
      else sub += ch;
    }
    if (sub) finalLines.push(sub);
  }
  return finalLines;
}
function makeUI(W, H, k, draw){
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(W*k); canvas.height = Math.round(H*k);
  const ctx = canvas.getContext('2d');
  const tex = new THREE.CanvasTexture(canvas);
  tex.generateMipmaps = false; tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.anisotropy = 1;
  const ui = {W, H, ctx, tex, regions:[], hover:null, press:null, dirty:true, mesh:null};
  ui.mat = new THREE.MeshBasicMaterial({map:tex, transparent:true, side:THREE.DoubleSide, fog:false, depthWrite:false});
  ui.reg = (id, x, y, w, h, fn) => ui.regions.push({id, x, y, w, h, fn});
  ui.redraw = () => {
    ui.regions.length = 0;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    draw(ctx, ui);
    tex.needsUpdate = true; ui.dirty = false;
  };
  ui.at = uv => {
    const cx = uv.x*W, cy = (1-uv.y)*H;
    for (let i = ui.regions.length-1; i >= 0; i--){
      const r = ui.regions[i];
      if (cx >= r.x-HIT_SLOP && cx <= r.x+r.w+HIT_SLOP && cy >= r.y-HIT_SLOP && cy <= r.y+r.h+HIT_SLOP) return r;
    }
    return null;
  };
  return ui;
}
function invalidateUI(){
  panel.dirty = true; dock.dirty = true;
  if (vr360UI) vr360UI.dirty = true;
  floatingWins.forEach(w => { w.ui.dirty = true; });
}

/* ---------- Floating Multi-Window System (Browser / Reader / Notes) ---------- */
const floatingWins = [];
const MAX_WINS = 3;

async function fetchWikiExtract(win, query){
  win.loading = true; win.ui.dirty = true;
  try{
    const lang = /[ก-๙]/.test(query) ? 'th' : 'en';
    const api = `https://${lang}.wikipedia.org/w/api.php?action=query&prop=extracts&exintro&explaintext&redirects=1&titles=${encodeURIComponent(query)}&origin=*&format=json`;
    const res = await fetch(api);
    const data = await res.json();
    const pages = data.query && data.query.pages ? Object.values(data.query.pages) : [];
    if (pages.length && pages[0].extract){
      win.articleTitle = pages[0].title || query;
      win.articleText = pages[0].extract;
      win.url = `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(win.articleTitle)}`;
    } else {
      win.articleTitle = query;
      win.articleText = `ไม่พบบทความสรุปสำหรับ "${query}" โดยตรง\nคุณสามารถกดปุ่ม [↗ เต็มจอ] ด้านบนเพื่อเปิดหน้าเว็บไซต์เต็มรูปแบบ หรือลองค้นหาคำอื่นได้`;
    }
  }catch(e){
    win.articleTitle = query;
    win.articleText = 'ไม่สามารถดึงข้อมูลบทความได้ในขณะนี้ (ตรวจสอบอินเทอร์เน็ต หรือกดปุ่ม ↗ เพื่อเปิดเบราว์เซอร์เต็มจอ)';
  }
  win.loading = false; win.scroll = 0; win.ui.dirty = true;
}

function drawFloatingWin(x, ui, win){
  const W = ui.W, H = ui.H, hv = ui.hover, pr = ui.press;
  x.clearRect(0, 0, W, H);
  x.textBaseline = 'alphabetic';

  // Drag bar
  ui.reg('wgrab', 150, 0, W-300, 36, null);
  x.fillStyle = (hv === 'wgrab') ? '#4f8cff' : 'rgba(255,255,255,.5)';
  roundRect(x, W/2 - 60, 6, 120, 10, 5); x.fill();

  // Window frame
  x.fillStyle = 'rgba(24,26,34,.96)';
  roundRect(x, 0, 22, W, H-22, 28); x.fill();
  x.strokeStyle = 'rgba(79,140,255,.45)'; x.lineWidth = 2;
  roundRect(x, 1, 23, W-2, H-24, 27); x.stroke();

  // Header bar
  x.fillStyle = 'rgba(255,255,255,.07)';
  roundRect(x, 12, 34, W-24, 52, 16); x.fill();
  x.fillStyle = '#fff'; x.font = 'bold 20px sans-serif'; x.textAlign = 'left';
  const headTitle = win.kind === 'browser' ? ('🌐 ' + win.title) : (win.kind === 'notes' ? ('📝 ' + win.title) : ('📊 ' + win.title));
  x.fillText(headTitle, 28, 67, W - 240);

  const btn = (id, txt, bx, bw, bg, fn) => {
    ui.reg(id, bx, 40, bw, 40, fn);
    x.fillStyle = pr === id ? '#6a6a75' : (hv === id ? '#52525c' : bg);
    roundRect(x, bx, 40, bw, 40, 12); x.fill();
    x.fillStyle = '#fff'; x.font = '18px sans-serif'; x.textAlign = 'center';
    x.fillText(txt, bx + bw/2, 66);
  };

  btn('wclose', '✕', W - 62, 42, '#b8372a', () => closeFloatingWin(win));

  if (win.kind === 'browser'){
    btn('wfull', '↗ เต็มจอ', W - 166, 94, '#2b6cb0', () => openWeb(win.url));
    btn('wsearch', '🔎 ค้นหา', W - 268, 94, '#3d3d46', () => {
      const q = prompt('ค้นหาหัวข้อ Wikipedia หรือพิมพ์ URL:', win.articleTitle || '');
      if (!q) return;
      if (/^https?:\/\//i.test(q) || /\.[a-z]{2,}$/i.test(q)){ win.url = normUrl(q); win.title = q; fetchWikiExtract(win, q); }
      else { win.title = q; fetchWikiExtract(win, q); }
    });

    // Quick topic pills
    const topics = ['ประเทศไทย', 'ดาราศาสตร์', 'ปัญญาประดิษฐ์', 'ความเป็นจริงเสมือน'];
    topics.forEach((tp, idx) => {
      const px = 20 + idx * 145, py = 96, pw = 136, ph = 34;
      ui.reg('tp:' + idx, px, py, pw, ph, () => { win.title = tp; fetchWikiExtract(win, tp); });
      x.fillStyle = hv === 'tp:' + idx ? '#4f8cff' : '#323644';
      roundRect(x, px, py, pw, ph, 17); x.fill();
      x.fillStyle = '#e0e6f5'; x.font = '15px sans-serif'; x.textAlign = 'center';
      x.fillText(tp, px + pw/2, py + 22, pw - 12);
    });

    // Content area
    x.fillStyle = 'rgba(12,14,20,.85)';
    roundRect(x, 18, 140, W - 92, H - 158, 16); x.fill();

    x.save();
    x.beginPath(); roundRect(x, 22, 144, W - 100, H - 166, 14); x.clip();
    x.fillStyle = '#4f8cff'; x.font = 'bold 22px sans-serif'; x.textAlign = 'left';
    x.fillText(win.loading ? 'กำลังโหลดข้อมูล...' : (win.articleTitle || win.title), 34, 178 - win.scroll);

    x.fillStyle = '#d8dee9'; x.font = '18px sans-serif';
    const lines = wrapText(x, win.articleText || '', W - 136);
    const maxScroll = Math.max(0, lines.length * 28 - (H - 230));
    win.scroll = clamp(win.scroll, 0, maxScroll);

    lines.forEach((ln, i) => {
      const ly = 214 + i * 28 - win.scroll;
      if (ly > 135 && ly < H - 12) x.fillText(ln, 34, ly);
    });
    x.restore();

    // Scroll buttons
    const sbtn = (id, ch, sy, fn) => {
      ui.reg(id, W - 64, sy, 48, 86, fn);
      x.fillStyle = hv === id ? '#4f8cff' : '#323644';
      roundRect(x, W - 64, sy, 48, 86, 14); x.fill();
      x.fillStyle = '#fff'; x.font = 'bold 26px sans-serif'; x.textAlign = 'center';
      x.fillText(ch, W - 40, sy + 52);
    };
    sbtn('scup', '▲', 148, () => { win.scroll = Math.max(0, win.scroll - 110); win.ui.dirty = true; });
    sbtn('scdn', '▼', H - 108, () => { win.scroll += 110; win.ui.dirty = true; });
  } else if (win.kind === 'notes'){
    btn('nadd', '＋ เพิ่มโน้ต', W - 184, 110, '#2e9e6b', () => {
      const t = prompt('พิมพ์ข้อความโน้ต:');
      if (t){ win.notes.push(t); saveList('pvr_notes', win.notes); win.ui.dirty = true; }
    });
    btn('nclr', '🗑 ล้าง', W - 274, 80, '#4a4a52', () => {
      win.notes = []; win.strokes = []; saveList('pvr_notes', win.notes); win.ui.dirty = true;
    });

    // Notes list on left, Sketch pad on right
    x.fillStyle = 'rgba(15,17,24,.85)';
    roundRect(x, 18, 98, 280, H - 116, 16); x.fill();
    x.fillStyle = '#9aa5b8'; x.font = 'bold 17px sans-serif'; x.textAlign = 'left';
    x.fillText('รายการบันทึก:', 32, 126);
    win.notes.slice(-7).forEach((nt, idx) => {
      x.fillStyle = '#fff'; x.font = '17px sans-serif';
      x.fillText('• ' + nt, 32, 158 + idx * 34, 252);
    });

    // Interactive paint canvas area
    const px = 312, py = 98, pw = W - 330, ph = H - 116;
    ui.reg('pad', px, py, pw, ph, () => {});
    x.fillStyle = '#12151f'; roundRect(x, px, py, pw, ph, 16); x.fill();
    x.strokeStyle = 'rgba(255,255,255,.15)'; roundRect(x, px, py, pw, ph, 16); x.stroke();
    x.fillStyle = 'rgba(255,255,255,.25)'; x.font = '15px sans-serif'; x.textAlign = 'right';
    x.fillText('จีบนิ้ววาดบนกระดานนี้ได้', px + pw - 14, py + 24);

    x.strokeStyle = '#39e08a'; x.lineWidth = 4; x.lineCap = 'round';
    win.strokes.forEach(st => {
      if (st.length < 2) return;
      x.beginPath(); x.moveTo(st[0].x, st[0].y);
      for (let i = 1; i < st.length; i++) x.lineTo(st[i].x, st[i].y);
      x.stroke();
    });
  } else if (win.kind === 'monitor'){
    // System & Sensor Monitor Window
    x.fillStyle = 'rgba(15,17,24,.85)';
    roundRect(x, 18, 98, W - 36, H - 116, 16); x.fill();
    x.fillStyle = '#6ee7b0'; x.font = 'bold 21px sans-serif'; x.textAlign = 'left';
    const info = [
      `สถานะการแทร็กมือ: ${H.count > 0 ? 'ตรวจพบ ' + H.count + ' มือ (' + delegate + ')' : 'ไม่พบมือ'}`,
      `ความเร็วตรวจจับมือ: ${D.ms.toFixed(1)} ms ต่อเฟรม`,

function spawnFloatingWin(kind, opts = {}){
  if (S.mode !== 'home') setMode('home');
  if (floatingWins.length >= MAX_WINS){
    closeFloatingWin(floatingWins[0]);
  }
  const W = 680, H = 430;
  const win = {
    id: 'w' + Date.now() + Math.random().toString(36).slice(2, 5),
    kind,
    title: opts.title || (kind === 'browser' ? 'VR Browser' : (kind === 'notes' ? 'สมุดโน้ต & วาดเขียน' : 'มอนิเตอร์ระบบ')),
    url: opts.url || 'https://th.wikipedia.org/',
    articleTitle: opts.topic || 'ความเป็นจริงเสมือน',
    articleText: 'กำลังโหลดเนื้อหา...',
    loading: false,
    scroll: 0,
    notes: loadList('pvr_notes').length ? loadList('pvr_notes') : ['จีบนิ้วที่แถบบนเพื่อลากหน้าต่าง', 'ปัดมือซ้าย/ขวาเพื่อเลื่อนหน้า'],
    strokes: [],
    curStroke: null
  };
  const ui = makeUI(W, H, 1.35, (ctx, u) => drawFloatingWin(ctx, u, win));
  win.ui = ui;
  const pivot = new THREE.Group();
  // Spread windows nicely in an arc around the user
  const offsets = [-0.62, 0.62, 0];
  const idx = floatingWins.length;
  pivot.rotation.y = opts.yaw !== undefined ? opts.yaw : offsets[idx % offsets.length];
  pivot.position.y = opts.y !== undefined ? opts.y : (idx === 2 ? 0.58 : 0.14);
  heading.add(pivot);

  const mesh = new THREE.Mesh(curvedGeo(1.18, 0.75, WIN_R), ui.mat);
  mesh.userData.ui = ui;
  mesh.userData.win = win;
  ui.mesh = mesh;
  pivot.add(mesh);
  win.pivot = pivot;
  floatingWins.push(win);

  if (kind === 'browser'){
    fetchWikiExtract(win, opts.topic || 'ความเป็นจริงเสมือน');
  }
  showToast('เปิดหน้าต่าง ' + win.title + ' แล้ว', 2000);
  invalidateUI();
  return win;
}

function closeFloatingWin(win){
  const i = floatingWins.indexOf(win);
  if (i < 0) return;
  floatingWins.splice(i, 1);
  heading.remove(win.pivot);
  win.ui.mesh.geometry.dispose();
  win.ui.mat.dispose();
  win.ui.tex.dispose();
  invalidateUI();
}

function openMultiWorkspace(){
  while (floatingWins.length) closeFloatingWin(floatingWins[0]);
  spawnFloatingWin('browser', {title:'Wikipedia VR', topic:'ความเป็นจริงเสมือน', yaw:-0.58, y:0.12});
  spawnFloatingWin('notes', {title:'กระดานโน้ต VR', yaw:0.58, y:0.12});
  showToast('เปิดโหมดหลายหน้าต่างแล้ว ลากแยกอิสระได้!', 3000);
}

const p360Ctx = proc360Cv.getContext('2d');
const proc360Tex = new THREE.CanvasTexture(proc360Cv);
proc360Tex.minFilter = THREE.LinearFilter; proc360Tex.magFilter = THREE.LinearFilter;
const vid360Tex = new THREE.VideoTexture(vid360);
vid360Tex.minFilter = THREE.LinearFilter; vid360Tex.magFilter = THREE.LinearFilter;

sphere360Geo.scale(-1, 1, 1); // Inside-out sphere

const V360_SCENES = ['กาแล็กซี 360°', 'ไซเบอร์กริด 360°', 'ออโรร่า 360°', 'วิดีโอจากเครื่อง'];
const V360 = {scene:0, playing:true, customLoaded:false, stars:Array.from({length:180}, () => ({x:Math.random()*1024, y:Math.random()*512, r:Math.random()*2.2+0.5, s:Math.random()*0.6+0.2}))};

function renderProc360(now){
  if (S.mode !== 'vr360' || !V360.playing) return;
  if (V360.scene === 3 && V360.customLoaded) return; // Using video texture
  const t = now * 0.001;
  const W = 1024, H = 512;
  if (V360.scene === 0){
    const g = p360Ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#050716'); g.addColorStop(0.5, '#161032'); g.addColorStop(1, '#060814');
    p360Ctx.fillStyle = g; p360Ctx.fillRect(0, 0, W, H);
    // Nebula waves
    for (let i = 0; i < 3; i++){
      p360Ctx.fillStyle = i === 0 ? 'rgba(90,149,255,.12)' : (i === 1 ? 'rgba(224,69,123,.1)' : 'rgba(57,224,138,.08)');
      p360Ctx.beginPath();
      for (let x = 0; x <= W; x += 32){
        const y = H/2 + Math.sin(x*0.008 + t*(0.8+i*0.3) + i*2) * (65 + i*25);
        if (x === 0) p360Ctx.moveTo(x, y); else p360Ctx.lineTo(x, y);
      }
      p360Ctx.lineTo(W, H); p360Ctx.lineTo(0, H); p360Ctx.closePath(); p360Ctx.fill();
    }
    p360Ctx.fillStyle = '#fff';
    V360.stars.forEach(st => {
      const sx = (st.x + t * 18 * st.s) % W;
      p360Ctx.beginPath(); p360Ctx.arc(sx, st.y, st.r, 0, Math.PI*2); p360Ctx.fill();
    });
  } else if (V360.scene === 1){
    const g = p360Ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#090418'); g.addColorStop(0.5, '#2a0b4e'); g.addColorStop(0.52, '#ff2a85'); g.addColorStop(1, '#090314');
    p360Ctx.fillStyle = g; p360Ctx.fillRect(0, 0, W, H);
    // Retro sun
    p360Ctx.fillStyle = '#ff9933';
    p360Ctx.beginPath(); p360Ctx.arc(W/2, H*0.42, 72, 0, Math.PI*2); p360Ctx.fill();
    // Moving grid lines
    p360Ctx.strokeStyle = 'rgba(0, 240, 255, 0.45)'; p360Ctx.lineWidth = 2;
    for (let x = 0; x < W; x += 32){
      p360Ctx.beginPath(); p360Ctx.moveTo(x, H*0.52); p360Ctx.lineTo(x, H); p360Ctx.stroke();
    }
    const offset = (t * 40) % 24;
    for (let y = H*0.52 + offset; y < H; y += 24){
      p360Ctx.beginPath(); p360Ctx.moveTo(0, y); p360Ctx.lineTo(W, y); p360Ctx.stroke();
    }
  } else {
    const g = p360Ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#021019'); g.addColorStop(0.55, '#072a30'); g.addColorStop(1, '#040d12');
    p360Ctx.fillStyle = g; p360Ctx.fillRect(0, 0, W, H);
    for (let b = 0; b < 4; b++){
      p360Ctx.strokeStyle = b % 2 === 0 ? 'rgba(57,224,138,.28)' : 'rgba(79,140,255,.24)';
      p360Ctx.lineWidth = 28;
      p360Ctx.beginPath();
      for (let x = 0; x <= W; x += 24){
        const y = 130 + b*35 + Math.sin(x*0.012 + t*1.3 + b) * 38;
        if (x === 0) p360Ctx.moveTo(x, y); else p360Ctx.lineTo(x, y);
      }
      p360Ctx.stroke();
    }
  }
  proc360Tex.needsUpdate = true;
}

function buildIntent(a){
  const link = (a.link || '').trim();
  if (!link || BLOCKED_SCHEMES.test(link)) return null;
  const m = link.match(/^([a-z][a-z0-9+.\-]*):\/\/(.*)$/i);
  if (!m || !a.pkg) return link;
  const fb = 'https://play.google.com/store/apps/details?id=' + a.pkg;
  return 'intent://' + m[2] + '#Intent;scheme=' + m[1].toLowerCase() + ';package=' + a.pkg + ';S.browser_fallback_url=' + encodeURIComponent(fb) + ';end';
}
function go(url){
  if (navigator.userActivation && !navigator.userActivation.isActive){
    N.pending = url; showToast('แตะจอ 1 ครั้งเพื่อเปิดแอป', 6000); return;
  }
  window.location.href = url;
}

function setTorch(on){

    .then(() => { N.torchOn = on; invalidateUI(); })
    .catch(() => { N.torchOK = false; N.torchOn = false; invalidateUI(); });
}

}

function applyExposure(){

  if (c.step) v = Math.round(v / c.step) * c.step;

  N.track.applyConstraints({advanced:[{exposureCompensation:v}]}).catch(() => {});
}

class OneEuro{
  constructor(){ this.x = null; this.dx = 0; this.t = 0; }
  reset(){ this.x = null; }
  static alpha(fc, te){ const tau = 1 / (2*Math.PI*fc); return 1 / (1 + tau/te); }
  filter(v, t, minC, beta){
    if (this.x === null){ this.x = v; this.dx = 0; this.t = t; return v; }
    const te = Math.max((t - this.t)/1000, 0.001); this.t = t;
    this.dx += OneEuro.alpha(1.0, te) * ((v - this.x)/te - this.dx);
    this.x += OneEuro.alpha(minC + beta*Math.abs(this.dx), te) * (v - this.x);
    return this.x;
  }
}

function easeCursor(dt){
  if (!H.ok) return;
  const k = 1 - Math.exp(-dt / 0.035);
  H.x += (H.tx - H.x)*k; H.y += (H.ty - H.y)*k;
  H.px += (H.ptx - H.px)*k; H.py += (H.pty - H.py)*k;
}

function updateLight(now){
  if (!S.cam || video.readyState < 2) return;
  if (now - N.lastProbe > 900){
    N.lastProbe = now;
    probeCtx.drawImage(video, 0, 0, 32, 18);
    const d = probeCtx.getImageData(0, 0, 32, 18).data;
    let sum = 0;
    for (let i = 0; i < d.length; i += 4) sum += d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
    N.lum = sum / (d.length/4);
    if (!N.dark && N.lum < 70) N.dark = true; else if (N.dark && N.lum > 105) N.dark = false;
    if (N.tm === 2 && N.torchOK && !N.torchOn && N.lum < 28) setTorch(true);
    const wantEV = N.mode === 2 ? 1 : 0;
    if (wantEV !== N.ev){ N.ev = wantEV; applyExposure(); }
    let tg = 1;
    if (N.mode === 2) tg = clamp(150 / Math.max(N.lum, 8), 1.5, 8);
    else if (N.mode === 1 && N.dark) tg = clamp(110 / Math.max(N.lum, 8), 1.5, 6);
    N.gainT = tg;
    const warn = N.lum < 20 && !N.torchOn && N.torchOK;
    if (warn !== N.warn){ N.warn = warn; dock.dirty = true; }
  }
  N.gain += (N.gainT - N.gain) * 0.25;
  const b = N.gain > 1.15;
  if (b !== N.boosting){ N.boosting = b; invalidateUI(); applyBackground(); }
}

function boostFrame(){
  const vw = video.videoWidth || 640, vh = video.videoHeight || 360;
  const w = Math.min(vw, 960), h = Math.round(w * vh / vw);
  if (boostCv.width !== w || boostCv.height !== h){ boostCv.width = w; boostCv.height = h; }
  if (HAS_FILTER){
    bctx.filter = 'brightness(' + N.gain.toFixed(2) + ') contrast(1.12)';
    bctx.drawImage(video, 0, 0, w, h);
  } else {
    bctx.globalCompositeOperation = 'source-over';
    bctx.drawImage(video, 0, 0, w, h);
    bctx.globalCompositeOperation = 'lighter';
    for (let i = 0, n = Math.max(0, Math.round(N.gain) - 1); i < n; i++) bctx.drawImage(video, 0, 0, w, h);
    bctx.globalCompositeOperation = 'source-over';
  }
  if (boostTex) boostTex.needsUpdate = true;
  N.drawnVT = video.currentTime;
}

const dist2 = (a, b) => Math.hypot(a.x-b.x, a.y-b.y);
const TIPS = [8,12,16,20], PIPS = [6,10,14,18];

function triggerAirSwipe(dir){
  // dir: -1 = swipe left (next page), +1 = swipe right (prev page)
  const bwin = floatingWins.find(w => w.kind === 'browser');
  if (bwin && panel.hover === null){
    bwin.scroll = Math.max(0, bwin.scroll + (dir < 0 ? 150 : -150));
    bwin.ui.dirty = true;
    showToast(dir < 0 ? '👋 ปัดเลื่อนลง' : '👋 ปัดเลื่อนขึ้น', 1400);
    return;
  }
  if (S.mode === 'vr360'){
    V360.scene = (V360.scene + (dir < 0 ? 1 : 2)) % (V360.customLoaded ? 4 : 3);
    sphere360Mat.map = (V360.scene === 3 && V360.customLoaded) ? vid360Tex : proc360Tex;
    sphere360Mat.needsUpdate = true; vr360UI.dirty = true;
    showToast('👋 ปัดเปลี่ยนฉาก 360°', 1600);
    return;
  }
  if (S.mode === 'home' && S.tab !== 'settings'){
    const cards = getCards(S.tab), pages = Math.max(1, Math.ceil(cards.length / 6));
    if (pages > 1){
      S.page = clamp(S.page + (dir < 0 ? 1 : -1), 0, pages - 1);
      invalidateUI();
      showToast(dir < 0 ? '👋 ปัดไปหน้าถัดไป' : '👋 ปัดไปหน้าก่อนหน้า', 1400);
    }
  }
}

function updateHands(now){
  if (!landmarker || !S.cam || video.readyState < 2 || video.currentTime === lastVT) return;
  detGap = Math.max(RATE_MS[P.rate], D.ms * 2.2);
  if (now - lastDet < detGap) return;
  lastVT = video.currentTime; lastDet = now;
  let src = video;
  if (N.boosting){ if (N.drawnVT !== video.currentTime) boostFrame(); src = boostCv; }
  const t0 = performance.now();
  const sw = src.videoWidth || src.width || 640, sh = src.videoHeight || src.height || 360;
  detCv.height = Math.round(384 * sh / sw);
  dctx.drawImage(src, 0, 0, 384, detCv.height);
  let r; try{ r = landmarker.detectForVideo(detCv, now); }catch(e){ return; }
  D.ms += ((performance.now() - t0) - D.ms) * 0.2;

  const lms = r.landmarks || [];
  H.count = lms.length;
  const lm = lms[0];
  H.lm2 = lms[1] || null;

  if (!lm){
    if (now - H.lastSeen > LOST_MS){ H.ok = false; H.lm = null; H.lm2 = null; H.pinch = false; H.pinch2 = false; H.fist = false; H.twoPinchDist0 = 0; }
    return;
  }
  const fresh = !H.ok;
  H.ok = true; H.lastSeen = now; H.lm = lm;
  if (fresh){ F.x.reset(); F.y.reset(); F.px.reset(); F.py.reset(); H.swipeHist.length = 0; }
  const sm = SMOOTH[P.smooth], pn = PINCH_SETS[P.pinch];

  // Fist detection on primary hand
  let curled = 0;
  for (let i = 0; i < 4; i++) if (dist2(lm[TIPS[i]], lm[0]) < dist2(lm[PIPS[i]], lm[0]) * 0.95) curled++;
  if (!H.fist && curled >= 4) H.fist = true; else if (H.fist && curled <= 2) H.fist = false;

  // Palm centre
  H.ptx = F.px.filter(lm[9].x*2-1, now, sm[0], sm[1]);
  H.pty = F.py.filter(-(lm[9].y*2-1), now, sm[0], sm[1]);

  // Pointer position
  const rx = P.ptr === 0 ? lm[8].x*2-1 : (lm[4].x + lm[8].x) - 1;
  const ry = P.ptr === 0 ? -(lm[8].y*2-1) : -((lm[4].y + lm[8].y) - 1);
  const nx = F.x.filter(rx, now, sm[0], sm[1]), ny = F.y.filter(ry, now, sm[0], sm[1]);
  const ratio = dist2(lm[4], lm[8]) / (dist2(lm[0], lm[9]) || 1e-3);
  if (fresh){ H.tx = H.x = nx; H.ty = H.y = ny; H.px = H.ptx; H.py = H.pty; }

  const was = H.pinch;
  let pinch = was;
  if (H.fist) pinch = false;
  else if (!pinch && ratio < pn[0]) pinch = true;
  else if (pinch && ratio > pn[1]) pinch = false;

  // Second hand pinch check + Two-Hand Pinch Zoom
  if (H.lm2){
    const r2 = dist2(H.lm2[4], H.lm2[8]) / (dist2(H.lm2[0], H.lm2[9]) || 1e-3);
    if (!H.pinch2 && r2 < pn[0]*1.15) H.pinch2 = true;
    else if (H.pinch2 && r2 > pn[1]*1.15) H.pinch2 = false;
  } else {
    H.pinch2 = false;
  }

  if (P.twoZoom && pinch && H.pinch2 && H.lm2){
    const dHands = Math.hypot(lm[8].x - H.lm2[8].x, lm[8].y - H.lm2[8].y);
    if (H.twoPinchDist0 <= 0.01){
      H.twoPinchDist0 = Math.max(0.08, dHands);
      H.twoPinchScale0 = S.pscale;
      showToast('🤏🤏 ซูมด้วยสองมือ', 1500);
    } else {
      S.pscale = clamp(H.twoPinchScale0 * (dHands / H.twoPinchDist0), PS_MIN, PS_MAX);
    }
    H.pinch = true;
    return;
  } else {
    H.twoPinchDist0 = 0;
  }

  // Air Swipe detection (when open palm moves quickly left/right)
  if (P.swipe && !pinch && !H.fist && curled <= 1 && !H.lm2){
    H.swipeHist.push({t:now, x:lm[9].x, y:lm[9].y});
    while (H.swipeHist.length && now - H.swipeHist[0].t > 280) H.swipeHist.shift();
    if (H.swipeHist.length >= 3 && now > H.swipeCool){
      const first = H.swipeHist[0], last = H.swipeHist[H.swipeHist.length - 1];
      const dx = last.x - first.x, dy = last.y - first.y;
      if (Math.abs(dx) > 0.24 && Math.abs(dy) < 0.14){
        H.swipeCool = now + 850;
        H.swipeHist.length = 0;
        triggerAirSwipe(dx > 0 ? 1 : -1);
      }
    }
  } else {
    H.swipeHist.length = 0;
  }

  if (pinch && !was) H.a = {nx, ny, cx:H.tx, cy:H.ty};
  if (pinch && H.a){
    H.tx = H.a.cx + (nx - H.a.nx); H.ty = H.a.cy + (ny - H.a.ny);
  } else if (ratio > HOLD_R){
    H.tx = nx; H.ty = ny;
  }
  H.pinch = pinch;
}

/* ---------- 3D hand skeletons (supports 2 hands) + pinch ray ---------- */
const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

function makeHandRig(ptColor, lineColor){
  const grp = new THREE.Group(); grp.visible = false; camera.add(grp);
  const jMat = new THREE.PointsMaterial({color:ptColor, size:0.018, sizeAttenuation:true, fog:false});
  const tMat = new THREE.MeshBasicMaterial({color:0xffffff, fog:false});
  const jPts = new THREE.Points(new THREE.BufferGeometry(), jMat);
  jPts.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(63), 3));
  jPts.frustumCulled = false; grp.add(jPts);
  const bLines = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({color:lineColor, fog:false}));
  bLines.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(CONN.length*6), 3));
  bLines.frustumCulled = false; grp.add(bLines);
  const tGeo = new THREE.SphereGeometry(0.016, 8, 6);
  const tA = new THREE.Mesh(tGeo, tMat), tB = new THREE.Mesh(tGeo, tMat);
  grp.add(tA); grp.add(tB);
  return {grp, jPts, bLines, tA, tB, tMat, hs:Array.from({length:21}, () => new THREE.Vector3()), init:false};
}

const handRig1 = makeHandRig(0xe6e8ef, 0xcfd3de);
const handRig2 = makeHandRig(0x93c5fd, 0x60a5fa);

const rayMat = new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.55, depthTest:false, fog:false});
const rayBone = new THREE.Mesh(new THREE.CylinderGeometry(0.0025, 0.0025, 1, 4, 1), rayMat);
rayBone.renderOrder = 998; rayBone.visible = false; scene.add(rayBone);

const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _d = new THREE.Vector3(), UP = new THREE.Vector3(0,1,0);
function placeBone(mesh, a, b){
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  _d.subVectors(b, a); const len = _d.length() || 1e-4;
  mesh.scale.set(1, len, 1);
  mesh.quaternion.setFromUnitVectors(UP, _d.multiplyScalar(1/len));
}

function syncRig(rig, lm, isPinch, isFist){
  if (!lm){ rig.grp.visible = false; rig.init = false; return; }
  rig.grp.visible = true;
  const tH = Math.tan(THREE.MathUtils.degToRad(camera.fov/2)), asp = camera.aspect;
  for (let i = 0; i < 21; i++){
    const l = lm[i];
    const depth = Math.min(2, Math.max(0.5, HAND_D + l.z*2.5));
    const tx = (l.x*2-1) * tH * asp * depth, ty = -(l.y*2-1) * tH * depth, tz = -depth;
    if (!rig.init) rig.hs[i].set(tx, ty, tz);
    else { rig.hs[i].x += (tx - rig.hs[i].x)*0.5; rig.hs[i].y += (ty - rig.hs[i].y)*0.5; rig.hs[i].z += (tz - rig.hs[i].z)*0.5; }
  }
  rig.init = true;
  const jp = rig.jPts.geometry.attributes.position.array, bp = rig.bLines.geometry.attributes.position.array;
  for (let i = 0; i < 21; i++){ jp[i*3] = rig.hs[i].x; jp[i*3+1] = rig.hs[i].y; jp[i*3+2] = rig.hs[i].z; }
  CONN.forEach((c, i) => { const p = rig.hs[c[0]], q = rig.hs[c[1]]; bp.set([p.x,p.y,p.z,q.x,q.y,q.z], i*6); });
  rig.jPts.geometry.attributes.position.needsUpdate = true; rig.bLines.geometry.attributes.position.needsUpdate = true;
  rig.tA.position.copy(rig.hs[4]); rig.tB.position.copy(rig.hs[8]);
  rig.tMat.color.set(isPinch ? 0x39e08a : (isFist ? 0x4f8cff : 0xffffff));
}

function updateHandViz(){
  if (!H.ok || !H.lm){
    handRig1.grp.visible = false; handRig2.grp.visible = false;
    rayBone.visible = false; handRig1.init = false; handRig2.init = false;
    return;
  }
  syncRig(handRig1, H.lm, H.pinch, H.fist);
  syncRig(handRig2, H.lm2, H.pinch2, false);

  if (H.fist) _a.copy(handRig1.hs[9]); else _a.copy(handRig1.hs[4]).add(handRig1.hs[8]).multiplyScalar(0.5);
  handRig1.grp.localToWorld(_a);
  _b.copy(cursor.position);
  placeBone(rayBone, _a, _b);
  rayMat.color.set(H.pinch ? 0x39e08a : (H.fist ? 0x4f8cff : 0xffffff));

}

/* ---------- interaction: hand / gaze dwell / tap / multi-window drag ---------- */
const ray = new THREE.Raycaster();
const cursor = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 10),
  new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, depthTest:false, depthWrite:false, fog:false}));
cursor.renderOrder = 999; scene.add(cursor);
let hoverKey = null, hoverT = 0, wasPinch = false, wasFist = false, cool = 0, tap = null, grab = null;
renderer.domElement.addEventListener('pointerdown', e => {
  if (N.swallow){ N.swallow = false; return; }
  tap = {x:e.clientX/innerWidth*2-1, y:-(e.clientY/innerHeight)*2+1};
});

const _dir = new THREE.Vector3(), Yaxis = new THREE.Vector3(0,1,0);
function rayYawY(R){
  _dir.copy(ray.ray.direction).applyAxisAngle(Yaxis, -heading.rotation.y);
  const hl = Math.hypot(_dir.x, _dir.z) || 1e-3;
  return {yaw:Math.atan2(_dir.x, -_dir.z), y:_dir.y / hl * R};
}
function startGrab(kind, target, type, winRef = null){
  const R = target === 'dock' ? DOCK_R : (target === 'win' ? WIN_R : PANEL_R);
  const r = rayYawY(R);
  grab = {kind, target, type, win:winRef, rayYaw:r.yaw, rayY:r.y, R};
  if (target === 'panel'){ grab.yaw0 = panelPivot.rotation.y; grab.y0 = panelPivot.position.y; grab.s0 = S.pscale; }
  else if (target === 'win' && winRef){ grab.yaw0 = winRef.pivot.rotation.y; grab.y0 = winRef.pivot.position.y; }
  else { grab.yaw0 = dockPivot.rotation.y; grab.y0 = dock.mesh.position.y; }
}
function allUIs(){
  const arr = [panel, dock];
  if (S.mode === 'vr360') arr.push(vr360UI);
  floatingWins.forEach(w => arr.push(w.ui));
  return arr;
}
function activeList(){
  const l = [];
  if (S.mode === 'home'){
    floatingWins.forEach(w => l.push(w.ui.mesh));
    if (panel.mesh.visible) l.push(panel.mesh);
  }
  l.push(dock.mesh);
  if (S.mode === 'shoot') l.push(...targets);
  else if (S.mode === 'gallery') l.push(...galleryItems);
  else if (S.mode === 'vr360') l.push(vr360UI.mesh);
  return l;
}

function interact(now, dt){
  const gazeOn = P.gaze === 1 || (P.gaze === 2 && S.stereo);
  let p = null, click = false, dwell = false, pinchDown = false, fistDown = false;
  if (tap){ p = S.stereo ? {x:0, y:0} : tap; click = true; tap = null; }
  else if (H.ok){ p = H.fist ? {x:H.px, y:H.py} : H; pinchDown = H.pinch && !wasPinch; fistDown = H.fist && !wasFist; click = pinchDown; }
  else if (gazeOn){ p = {x:0, y:0}; dwell = true; }
  const pinching = H.ok && H.pinch, fisting = H.ok && H.fist;
  wasPinch = pinching; wasFist = fisting;

  if (!p || H.twoPinchDist0 > 0){
    grab = null; cursor.visible = false; hoverKey = null; hoverT = 0;
    allUIs().forEach(u => { if (u.hover || u.press){ u.hover = null; u.press = null; u.dirty = true; } });
    return;
  }
  cursor.visible = true;
  ray.setFromCamera(p, camera);

  // --- dragging the panel / dock / floating windows ---
  if (grab){
    const alive = grab.kind === 'fist' ? fisting : pinching;
    if (!alive){
      grab = null;
      allUIs().forEach(u => { u.hover = null; u.press = null; u.dirty = true; });
    } else {
      const r = rayYawY(grab.R);
      if (grab.type === 'resize'){
        const w0 = BASE_W*grab.s0, h0 = BASE_H*grab.s0;
        const dx = (r.yaw - grab.rayYaw)*grab.R, dy = r.y - grab.rayY;
        S.pscale = clamp(grab.s0 * (1 + 0.5*(dx/(w0/2) - dy/(h0/2))), PS_MIN, PS_MAX);
      } else if (grab.target === 'panel'){
        panelPivot.rotation.y = grab.yaw0 - (r.yaw - grab.rayYaw);
        panelPivot.position.y = clamp(grab.y0 + (r.y - grab.rayY), -0.5, 1.0);
      } else if (grab.target === 'win' && grab.win){
        grab.win.pivot.rotation.y = grab.yaw0 - (r.yaw - grab.rayYaw);
        grab.win.pivot.position.y = clamp(grab.y0 + (r.y - grab.rayY), -0.45, 1.05);
      } else {
        dockPivot.rotation.y = grab.yaw0 - (r.yaw - grab.rayYaw);
        dock.mesh.position.y = clamp(grab.y0 + (r.y - grab.rayY), -1.1, 0.5);
      }
      ray.ray.at(grab.R, cursor.position);
      cursor.material.color.set(0x39e08a); cursor.scale.setScalar(1);
      return;
    }
  }

  const list = activeList();
  const hit = ray.intersectObjects(list, false)[0];
  const obj = hit ? hit.object : null;
  const ui = obj && obj.userData.ui ? obj.userData.ui : null;
  const winRef = obj && obj.userData.win ? obj.userData.win : null;
  const reg = ui ? ui.at(hit.uv) : null;

  // Sketchpad drawing inside Notes window
  if (winRef && winRef.kind === 'notes' && reg && reg.id === 'pad' && hit.uv){
    const cx = hit.uv.x * ui.W, cy = (1 - hit.uv.y) * ui.H;
    if (pinching){
      if (!winRef.curStroke){ winRef.curStroke = []; winRef.strokes.push(winRef.curStroke); }
      winRef.curStroke.push({x:cx, y:cy});
      winRef.ui.dirty = true;
    } else {
      winRef.curStroke = null;
    }
  } else if (!pinching){
    floatingWins.forEach(w => { w.curStroke = null; });
  }

  allUIs().forEach(u => {
    const h = (u === ui && reg) ? reg.id : null;
    const pr = (h && pinching) ? h : null;
    if (u.hover !== h || u.press !== pr){ u.hover = h; u.press = pr; u.dirty = true; }
  });

  list.forEach(o => {
    if (o.userData.ui) return;
    const s = (o === obj) ? 1.12 : 1;
    o.scale.x += (s - o.scale.x)*0.3; o.scale.y = o.scale.z = o.scale.x;
  });

  if (fistDown && ui){
    if (winRef) startGrab('fist', 'win', 'move', winRef);
    else startGrab('fist', ui === dock ? 'dock' : 'panel', 'move');
  }

  const fn = ui ? (reg && reg.fn) : (obj && obj.userData.onClick);
  const key = (obj && (ui ? (reg && reg.fn ? obj.id + ':' + reg.id : null) : String(obj.id))) || null;
  if (dwell){
    if (key && key === hoverKey) hoverT += dt; else hoverT = 0;
    if (key && hoverT > 1.0){ click = true; hoverT = 0; }
  } else hoverT = 0;
  hoverKey = key;

  if (click && now > cool && !grab){
    if (pinchDown && ui === panel && reg && reg.id === 'grab') startGrab('pinch', 'panel', 'move');
    else if (pinchDown && ui === panel && reg && reg.id === 'resize') startGrab('pinch', 'panel', 'resize');
    else if (pinchDown && winRef && reg && reg.id === 'wgrab') startGrab('pinch', 'win', 'move', winRef);
    else if (pinchDown && ui === dock && reg && reg.id === 'dockbg') startGrab('pinch', 'dock', 'move');
    else if (fn){ cool = now + 320; fn(); }
  }

  if (hit) cursor.position.copy(hit.point).addScaledVector(ray.ray.direction, -0.03);
  else ray.ray.at(PANEL_R, cursor.position);
  cursor.material.color.set(H.ok ? (H.pinch ? 0x39e08a : (H.fist ? 0x4f8cff : 0xffffff)) : 0xffd24a);
  cursor.scale.setScalar(1 + hoverT*2);
}

/* ---------- loop ---------- */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = (S.stereo ? w/2 : w) / h;
  camera.updateProjectionMatrix();
  hud.style.display = S.stereo ? 'none' : 'block';
}
function render(){
  const w = innerWidth, h = innerHeight;
  if (S.stereo){
    camera.updateMatrixWorld(); stereo.eyeSep = S.ipd; stereo.update(camera);
    renderer.setScissorTest(true);
    renderer.setViewport(0, 0, w/2, h); renderer.setScissor(0, 0, w/2, h); renderer.render(scene, stereo.cameraL);
    renderer.setViewport(w/2, 0, w/2, h); renderer.setScissor(w/2, 0, w/2, h); renderer.render(scene, stereo.cameraR);
    renderer.setScissorTest(false);
  } else {
    renderer.setViewport(0, 0, w, h); renderer.render(scene, camera);
  }
}
let last = 0, fpsN = 0, fpsT = 0, lowT = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now - last)/1000, 0.1); last = now;
  if (N.webOpen) return;
  camera.quaternion.copy(devQ); camera.updateMatrixWorld(true);
  updateLight(now);
  if (N.boosting && S.mr && video.currentTime !== N.drawnVT) boostFrame();
  updateHands(now);
  easeCursor(dt);
  interact(now, dt);
  syncPanelGeo();
  updateHandViz();
  if (toast.mesh.visible){
    if (now > N.msgUntil) toast.mesh.visible = false;
    else toast.mesh.position.set(0, dock.mesh.position.y + 0.24, -DOCK_R + 0.02);
  }
  [panel, dock, toast, vr360UI, ...floatingWins.map(w => w.ui)].forEach(u => {
    if (u && u.dirty && u.mesh && u.mesh.visible && now - (u.lastDraw || 0) > 75){ u.lastDraw = now; u.redraw(); }
  });

  if (S.mode === 'shoot'){
    spawnAcc += dt; if (spawnAcc > 1.1){ spawnAcc = 0; spawnTarget(); }
    targets.slice().forEach(t => { if (now - t.userData.born > 7000) popTarget(t); });
  } else if (S.mode === 'gallery'){
    galleryItems.forEach(m => { m.rotation.y += dt*m.userData.spd; m.rotation.x += dt*0.3*m.userData.spd; });
  } else if (S.mode === 'vr360'){
    renderProc360(now);
  }
  render();

  fpsN++; fpsT += dt;
  if (fpsT > 0.5){
    const hState = H.ok ? (H.twoPinchDist0 > 0 ? '2-hand-zoom' : (H.fist ? 'fist' : (H.pinch ? 'pinch' : 'ok(' + H.count + ')'))) : 'none';
    hud.textContent = VERSION + ' | ' + Math.round(fpsN/fpsT) + ' fps | hand: ' + hState + ' (' + delegate + ', ' + D.ms.toFixed(0) + 'ms)\nmode: ' + S.mode + ' | wins: ' + floatingWins.length + ' | ui x' + S.pscale.toFixed(2) + ' | light ' + Math.round(N.lum);
    const fpsNow = fpsN/fpsT;
    if (fpsNow < 20 && S.qi > 0 && S.cam !== undefined){ lowT += 0.5; if (lowT >= 2.5){ S.qi--; applyQuality(); savePrefs(); invalidateUI(); lowT = 0; } } else lowT = 0;
    fpsN = 0; fpsT = 0;
  }
}

/* ---------- start ---------- */
addEventListener('resize', resize);

$('wgo').onclick = () => openWeb($('wurl').value);
$('wurl').addEventListener('keydown', e => { if (e.key === 'Enter') openWeb($('wurl').value); });
$('wh').onclick = () => { if (N.webUrl) $('wframe').src = N.webUrl; };
$('wx').onclick = () => { window.open($('wurl').value || N.webUrl, '_blank', 'noopener'); };
$('wc').onclick = closeWeb;

document.addEventListener('pointerdown', () => {
  if (!N.pending) return;
  const u = N.pending; N.pending = null; N.swallow = true;
  setTimeout(() => { N.swallow = false; }, 80);
  window.location.href = u;
}, true);

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !S.cam) return;
  try{ if (N.track && N.track.readyState === 'ended') await initCamera(); else await video.play(); }catch(e){}
  try{ if (navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){}
});

$('go').onclick = async () => {
  $('msg').textContent = 'กำลังเริ่ม...';
  try{ if (DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); }catch(e){}
  addEventListener('deviceorientation', onOrient, true);
  try{ await document.documentElement.requestFullscreen(); await screen.orientation.lock('landscape'); }catch(e){}
  try{ if (navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){}
  await initCamera();
  initHands();
  $('start').remove();
  panel.mesh.visible = true;
  applyQuality(); recenterHeading(); drawScore(); invalidateUI();
  requestAnimationFrame(frame);
};
</script>
