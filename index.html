<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>PocketVR</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10121a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;touch-action:manipulation}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
video{position:fixed;left:-10px;top:0;width:2px;height:2px;pointer-events:none}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#0b1220;z-index:5;text-align:center;padding:20px}
#start button{font-size:20px;padding:14px 36px;border-radius:30px;border:0;background:#4f8cff;color:#fff;cursor:pointer}
#start p{margin:0;opacity:.85;line-height:1.5}
#hud{position:fixed;left:8px;top:6px;font:11px monospace;opacity:.7;z-index:3;white-space:pre;pointer-events:none}
#vr-divider{position:fixed;left:50%;top:0;bottom:0;width:3px;background:rgba(255,255,255,0.25);transform:translateX(-50%);z-index:2;pointer-events:none;display:none}
#web{position:fixed;left:6%;right:6%;top:5%;bottom:5%;z-index:4;display:flex;flex-direction:column;background:#1e1e21;border-radius:18px;overflow:hidden;touch-action:auto;box-shadow:0 0 0 2px #3a3a3f}
#web[hidden]{display:none}
#web.fl1,#web.fl2{top:14%;bottom:14%;width:42%;box-shadow:0 0 0 2px #4f8cff,0 8px 30px rgba(0,0,0,.6)}
#web.fl1{left:auto;right:3%}
#web.fl2{left:3%;right:auto}
#wbar{display:flex;gap:6px;padding:6px;align-items:center;background:#2a2a2e}
#wbar button{border:0;border-radius:12px;background:#3d3d43;color:#fff;font-size:18px;min-width:44px;height:40px}
#wbar button:active{background:#5a5a64}
#wurl{flex:1;min-width:0;height:40px;border:0;border-radius:12px;background:#111;color:#fff;padding:0 12px;font-size:15px}
#wframe{flex:1;border:0;background:#fff;touch-action:auto}
</style>
</head>
<body>
<div id="start">
  <h2 style="margin:0">PocketVR</h2>
  <p>หมุนจอเป็นแนวนอน แล้วกดเริ่ม<br>อนุญาตกล้อง + เซนเซอร์เมื่อถูกถาม</p>
  <button id="go">เริ่มใช้งาน VR</button>
  <p id="msg" style="font-size:13px"></p>
</div>
<div id="vr-divider"></div>
<div id="hud"></div>
<div id="web" hidden>
  <div id="wbar">
    <button id="wh" title="หน้าแรกของเว็บนี้">⌂</button>
    <input id="wurl" type="text" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false">
    <button id="wgo">ไป</button>
    <button id="wx" title="เปิดในแท็บใหม่">↗</button>
    <button id="wf" title="ลอย / เต็มจอ">◱</button>
    <button id="wc" title="ปิด">✕</button>
  </div>
  <iframe id="wframe" referrerpolicy="no-referrer" allow="fullscreen; autoplay; clipboard-write" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"></iframe>
</div>
<video id="cam" playsinline muted autoplay></video>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
<script type="module">
import {HandLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const VERSION = 'v3.7c-fix';
const $ = id => document.getElementById(id);
const hud = $('hud'), video = $('cam'), vrDivider = $('vr-divider');
const BG = 0x0b1220;

// ปรับค่า IPD เริ่มต้นให้แคบลงเหมาะกับเลนส์ VR Box บนมือถือ
const IPDS = [0.052, 0.058, 0.062, 0.066];
const QUAL = [0.75, 1, 1.5], QNAMES = ['ประหยัด', 'ปกติ', 'คมชัด'];
const S = {mr:false, stereo:true, ipd:0.058, mode:'home', tab:'all', score:0, cam:false, qi:1, pscale:1.15, page:0};

/* --- dark-room support --- */
const NMODES = ['ปิด', 'อัตโนมัติ', 'สว่างสุด'], TMODES = ['ปิด', 'เปิด', 'อัตโนมัติ'];
const N = {mode:1, tm:0, lum:128, gain:1, gainT:1, dark:false, boosting:false, warn:false,
           torchOK:false, torchOn:false, ev:0, expCap:null, track:null, lastProbe:0, drawnVT:-1,
           pending:null, pendingFn:null, webFloat:0, swallow:false, webOpen:false, webUrl:'', msg:'', msgUntil:0};
const HAS_FILTER = 'filter' in CanvasRenderingContext2D.prototype;
const probeCv = document.createElement('canvas'); probeCv.width = 32; probeCv.height = 18;
const probeCtx = probeCv.getContext('2d', {willReadFrequently:true});
const boostCv = document.createElement('canvas'); boostCv.width = 960; boostCv.height = 540;
const bctx = boostCv.getContext('2d');
let boostTex = null;

/* --- phone apps & web shortcuts --- */
const APPS = [
  {n:'YouTube',     i:'▶️', pkg:'com.google.android.youtube',      link:'https://www.youtube.com/'},
  {n:'Spotify',     i:'🎵', pkg:'com.spotify.music',               link:'spotify://'},
  {n:'LINE',        i:'💬', pkg:'jp.naver.line.android',           link:'line://'},
  {n:'Facebook',    i:'📘', pkg:'com.facebook.katana',             link:'fb://'},
  {n:'Messenger',   i:'✉️', pkg:'com.facebook.orca',               link:'fb-messenger://'},
  {n:'Instagram',   i:'📷', pkg:'com.instagram.android',           link:'https://www.instagram.com/'},
  {n:'TikTok',      i:'🎬', pkg:'com.zhiliaoapp.musically',        link:'https://www.tiktok.com/'},
  {n:'Netflix',     i:'🍿', pkg:'com.netflix.mediaclient',         link:'https://www.netflix.com/'},
  {n:'Google Maps', i:'🗺', pkg:'com.google.android.apps.maps',    link:'https://maps.google.com/'},
  {n:'Discord',     i:'🎧', pkg:'com.discord',                     link:'https://discord.com/'}
];
const WEBS = [
  {n:'Wikipedia',     i:'📚', url:'https://th.wikipedia.org/'},
  {n:'แผนที่ OSM',    i:'🗺', url:'https://www.openstreetmap.org/export/embed.html?bbox=100.45%2C13.65%2C100.65%2C13.85&layer=mapnik'},
  {n:'DuckDuckGo',    i:'🔎', url:'https://html.duckduckgo.com/html/'}
];
const BLOCKED_SCHEMES = /^(javascript|data|file|blob|about|vbscript):/i;
function loadList(k){ try{ const v = JSON.parse(localStorage.getItem(k) || '[]'); return Array.isArray(v) ? v : []; }catch(e){ return []; } }
function saveList(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let customApps = loadList('pvr_apps'), customWebs = loadList('pvr_webs');

/* --- tunables --- */
const PINCH_SETS = [[0.18, 0.30, 'แน่น'], [0.22, 0.34, 'กลาง'], [0.28, 0.42, 'หลวม']];
const SMOOTH = [[2.5, 4, 'ไว'], [1.2, 3, 'กลาง'], [0.6, 2.5, 'นุ่ม']];
const RATE_MS = [33, 50, 80], RATE_N = ['เร็ว', 'กลาง', 'ประหยัด'];
const GAZE_N = ['ปิด', 'เปิด', 'เฉพาะแบ่งจอ'], PTR_N = ['ปลายนิ้วชี้', 'กึ่งกลางนิ้วจีบ'], DEV_N = ['GPU', 'CPU'];
const LOST_MS = 650;
const HOLD_R = 0.45;
const HIT_SLOP = 8;
const HAND_D = 1.1;
const PANEL_R = 2.0, DOCK_R = 1.8;
const BASE_W = 2.0, BASE_H = 1.1;
const PS_MIN = 0.6, PS_MAX = 2.0;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* --- saved preferences --- */
const P = {gaze:1, ptr:0, smooth:1, rate:1, pinch:1, dev:0, two:0};
function loadPrefs(){
  try{
    const o = JSON.parse(localStorage.getItem('pvr_prefs') || '{}');
    for (const k of Object.keys(P)) if (Number.isInteger(o[k]) && o[k] >= 0) P[k] = o[k];
    P.gaze = Math.min(P.gaze, 2); P.ptr = Math.min(P.ptr, 1); P.smooth = Math.min(P.smooth, 2);
    P.rate = Math.min(P.rate, 2); P.pinch = Math.min(P.pinch, 2); P.dev = Math.min(P.dev, 1); P.two = Math.min(P.two, 1);
    if (Number.isInteger(o.qi) && o.qi >= 0) S.qi = Math.min(o.qi, 2);
    if (Number.isInteger(o.nm) && o.nm >= 0) N.mode = Math.min(o.nm, 2);
    if (IPDS.includes(o.ipd)) S.ipd = o.ipd;
  }catch(e){}
}
function savePrefs(){
  try{ localStorage.setItem('pvr_prefs', JSON.stringify(Object.assign({}, P, {qi:S.qi, nm:N.mode, ipd:S.ipd}))); }catch(e){}
}
loadPrefs();

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 6, 22);

const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 50);
scene.add(camera);

// จุดสำคัญ: ตั้งค่า StereoCamera ให้จุดตัดสายตาตรงกับระยะ UI
const stereo = new THREE.StereoCamera();
stereo.aspect = 0.5;
stereo.eyeSep = S.ipd;

scene.add(new THREE.HemisphereLight(0xffffff, 0x334466, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(1, 2, 1); scene.add(sun);

const env = new THREE.Group(); scene.add(env);
const grid = new THREE.GridHelper(30, 30, 0x4f8cff, 0x1c2b4a); grid.position.y = -1.6; env.add(grid);

const heading = new THREE.Group(); scene.add(heading);
const groups = {shoot:new THREE.Group(), gallery:new THREE.Group()};
Object.values(groups).forEach(g => heading.add(g));

function applyQuality(){
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, QUAL[S.qi]));
  resize();
}

/* ---------- canvas UI toolkit ---------- */
function roundRect(x, a, b, w, h, r){
  x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r);
  x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath();
}
function makeUI(W, H, k, draw){
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(W*k); canvas.height = Math.round(H*k);
  const ctx = canvas.getContext('2d');
  const tex = new THREE.CanvasTexture(canvas);
  tex.generateMipmaps = false; tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.anisotropy = 1;
  const ui = {W, H, ctx, tex, regions:[], hover:null, press:null, dirty:true, mesh:null};
  ui.mat = new THREE.MeshBasicMaterial({map:tex, transparent:true, side:THREE.DoubleSide, fog:false, depthWrite:false});
  ui.reg = (id, x, y, w, h, fn) => ui.regions.push({id, x, y, w, h, fn});
  ui.redraw = () => {
    ui.regions.length = 0;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    draw(ctx, ui);
    tex.needsUpdate = true; ui.dirty = false;
  };
  ui.at = uv => {
    const cx = uv.x*W, cy = (1-uv.y)*H;
    for (let i = ui.regions.length-1; i >= 0; i--){
      const r = ui.regions[i];
      if (cx >= r.x-HIT_SLOP && cx <= r.x+r.w+HIT_SLOP && cy >= r.y-HIT_SLOP && cy <= r.y+r.h+HIT_SLOP) return r;
    }
    return null;
  };
  return ui;
}
function invalidateUI(){ panel.dirty = true; dock.dirty = true; }

/* ---------- actions ---------- */
function toggleMR(){ if (!S.cam) return; setMR(!S.mr); invalidateUI(); }
function toggleSplit(){ S.stereo = !S.stereo; resize(); invalidateUI(); }
function cycleIPD(){ 
  S.ipd = IPDS[(IPDS.indexOf(S.ipd)+1) % IPDS.length]; 
  stereo.eyeSep = S.ipd;
  savePrefs(); 
  invalidateUI(); 
  showToast('ระยะตา (IPD): ' + Math.round(S.ipd*1000) + ' mm', 1500);
}
function cycleQuality(){ S.qi = (S.qi + 1) % QUAL.length; applyQuality(); savePrefs(); invalidateUI(); }
function zoomPanel(f){ S.pscale = clamp(S.pscale*f, PS_MIN, PS_MAX); }
function showToast(msg, ms){
  N.msg = msg; N.msgUntil = performance.now() + (ms || 3500);
  if (typeof toast !== 'undefined'){ toast.dirty = true; toast.mesh.visible = true; }
}
function buildIntent(a){
  const link = (a.link || '').trim();
  if (!link || BLOCKED_SCHEMES.test(link)) return null;
  const m = link.match(/^([a-z][a-z0-9+.\-]*):\/\/(.*)$/i);
  if (!m || !a.pkg) return link;
  const fb = 'https://play.google.com/store/apps/details?id=' + a.pkg;
  return 'intent://' + m[2] + '#Intent;scheme=' + m[1].toLowerCase() + ';package=' + a.pkg + ';S.browser_fallback_url=' + encodeURIComponent(fb) + ';end';
}
function go(url){
  if (navigator.userActivation && !navigator.userActivation.isActive){
    N.pending = url; showToast('แตะจอ 1 ครั้งเพื่อเปิดแอป', 6000); return;
  }
  window.location.href = url;
}
function launchApp(a){
  const u = buildIntent(a);
  if (!u){ showToast('ลิงก์แอปไม่ถูกต้อง'); return; }
  showToast('กำลังเปิด ' + a.n + '…', 2500);
  go(u);
}
function addApp(){
  const n = (prompt('ชื่อแอป (เช่น YouTube)') || '').trim(); if (!n) return;
  const pkg = (prompt('ชื่อแพ็กเกจ (เช่น com.google.android.youtube)\nเว้นว่างได้ถ้าลิงก์เปิดแอปได้อยู่แล้ว') || '').trim();
  const link = (prompt('ลิงก์ที่แอปรองรับ\nเช่น https://www.youtube.com/ หรือ line://') || '').trim();
  if (!link || BLOCKED_SCHEMES.test(link) || !/^[a-z][a-z0-9+.\-]*:\/\//i.test(link)){ showToast('ลิงก์ไม่ถูกต้อง'); return; }
  customApps.push({n, pkg, link, i:'📱', custom:true}); saveList('pvr_apps', customApps); invalidateUI();
}
function clearApps(){ if (confirm('ลบแอปที่เพิ่มเองทั้งหมด?')){ customApps = []; saveList('pvr_apps', customApps); S.page = 0; invalidateUI(); } }
function normUrl(u){
  u = (u || '').trim(); if (!u) return null;
  if (/^https?:\/\//i.test(u)) return u;
  if (BLOCKED_SCHEMES.test(u)) return null;
  if (/^[^\s\/]+\.[^\s]+$/.test(u)) return 'https://' + u;
  return 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(u);
}
function openWeb(url){
  const u = normUrl(url); if (!u){ showToast('URL ไม่ถูกต้อง'); return; }
  if (S.stereo){ S.stereo = false; resize(); invalidateUI(); }
  N.webUrl = u; $('wurl').value = u; $('wframe').src = u;
  $('web').hidden = false; N.webOpen = true;
}
function closeWeb(){
  $('web').hidden = true; $('wframe').src = 'about:blank'; N.webOpen = false; invalidateUI();
}
function addWeb(){
  const n = (prompt('ชื่อเว็บ') || '').trim(); if (!n) return;
  const url = normUrl(prompt('URL (เช่น https://th.wikipedia.org)') || ''); if (!url){ showToast('URL ไม่ถูกต้อง'); return; }
  customWebs.push({n, url, i:'🌐', custom:true}); saveList('pvr_webs', customWebs); invalidateUI();
}
function askWeb(){ const u = prompt('พิมพ์ URL หรือคำค้นหา'); if (u) openWeb(u); }
function clearWebs(){ if (confirm('ลบเว็บที่เพิ่มเองทั้งหมด?')){ customWebs = []; saveList('pvr_webs', customWebs); S.page = 0; invalidateUI(); } }
function setTorch(on){
  if (!N.track || !N.torchOK) return;
  N.track.applyConstraints({advanced:[{torch:on}]})
    .then(() => { N.torchOn = on; invalidateUI(); })
    .catch(() => { N.torchOK = false; N.torchOn = false; invalidateUI(); });
}
function applyTorch(){
  if (!N.torchOK) return;
  if (N.tm === 1 && !N.torchOn) setTorch(true);
  else if (N.tm === 0 && N.torchOn) setTorch(false);
}
function cycleTorch(){ if (!N.torchOK) return; N.tm = (N.tm + 1) % 3; applyTorch(); invalidateUI(); }
function quickTorch(){ if (!N.torchOK) return; N.tm = (N.tm === 1) ? 0 : 1; applyTorch(); invalidateUI(); }
function cycleNight(){ N.mode = (N.mode + 1) % 3; N.lastProbe = 0; savePrefs(); invalidateUI(); }
function cycleP(k, n){ P[k] = (P[k] + 1) % n; savePrefs(); invalidateUI(); }
function cycleGaze(){ cycleP('gaze', 3); }
function cyclePtr(){ cycleP('ptr', 2); }
function cycleSmooth(){ cycleP('smooth', 3); }
function cycleRate(){ cycleP('rate', 3); }
function cyclePinch(){ cycleP('pinch', 3); }
function cycleDev(){ cycleP('dev', 2); showToast('เปลี่ยนตัวประมวลผลแทร็กมือ…', 2500); reinitHands(); }
function cycleTwo(){ cycleP('two', 2); showToast(P.two ? 'โหมดสองมือเปิด: จีบสองมือแล้วถ่างเพื่อซูม' : 'ปิดโหมดสองมือ', 3000); reinitHands(); }
async function reinitHands(){
  try{ if (landmarker){ landmarker.close(); landmarker = null; } }catch(e){ landmarker = null; }
  H.ok = false; H.lm = null; H.pinch = false; H.fist = false;
  await initHands();
  invalidateUI();
}
function resetSettings(){
  Object.assign(P, {gaze:1, ptr:0, smooth:1, rate:1, pinch:1, dev:0, two:0});
  S.qi = 1; N.mode = 1; S.ipd = 0.058; stereo.eyeSep = 0.058; N.lastProbe = 0;
  applyQuality(); savePrefs(); invalidateUI(); showToast('รีเซ็ตการตั้งค่าแล้ว', 2500);
  reinitHands();
}
function applyExposure(){
  if (!N.track || !N.expCap) return;
  const c = N.expCap;
  let v = N.ev ? c.max * 0.85 : 0;
  if (c.step) v = Math.round(v / c.step) * c.step;
  v = clamp(v, c.min, c.max);
  N.track.applyConstraints({advanced:[{exposureCompensation:v}]}).catch(() => {});
}
function applyBackground(){
  if (!S.mr) return;
  scene.background = (N.boosting && boostTex) ? boostTex : videoTex;
}
function resetPanel(){
  recenterHeading();
  panelPivot.rotation.y = 0; panelPivot.position.y = 0.12; S.pscale = 1.15;
  dockPivot.rotation.y = 0; dock.mesh.position.y = -0.72;
}

/* ---------- app panel ---------- */
const PW = 1024, PH = 563;
const NAV = [['all','▦','ทั้งหมด','แอปและเครื่องมือ'], ['apps','🎮','แอปและเกม','แอปและเกม'], ['phone','📱','แอปในเครื่อง','แอปในเครื่อง'], ['web','🌐','เว็บ','เว็บไซต์'], ['settings','⚙','ตั้งค่า','ตั้งค่า']];
const GRAY = ['#56565e','#38383e'];
const CARDS = {
  shoot:   {icon:'🎯', t:'ยิงเป้า',      sub:() => 'เกม',  g:['#ff7a6b','#b8372a'], fn:() => setMode('shoot')},
  gallery: {icon:'🖼', t:'ห้องจัดแสดง',  sub:() => 'แอป',  g:['#5a95ff','#2a4fa8'], fn:() => setMode('gallery')},
  mr:      {icon:'📷', t:'ภาพจริง (MR)', sub:() => S.mr ? 'เปิดอยู่' : 'ปิดอยู่', on:() => S.mr, g:GRAY, fn:toggleMR},
  split:   {icon:'🥽', t:'แบ่งจอ VR',    sub:() => S.stereo ? 'เปิดอยู่' : 'ปิดอยู่', on:() => S.stereo, g:GRAY, fn:toggleSplit},
  ipd:     {icon:'↔', t:'ระยะตา',       sub:() => Math.round(S.ipd*1000) + ' mm', g:GRAY, fn:cycleIPD},
  quality: {icon:'✨', t:'คุณภาพภาพ',    sub:() => QNAMES[S.qi], g:GRAY, fn:cycleQuality},
  night:   {icon:'🌙', t:'โหมดมืด',      sub:() => NMODES[N.mode] + (N.boosting ? ' ×' + N.gain.toFixed(1) : ''), on:() => N.boosting, g:GRAY, fn:cycleNight},
  torch:   {icon:'🔦', t:'ไฟฉาย',        sub:() => N.torchOK ? TMODES[N.tm] : 'ไม่รองรับ', on:() => N.torchOn, g:GRAY, fn:cycleTorch},
  center:  {icon:'⌖', t:'จัดกลางใหม่',  sub:() => 'รีเซ็ตตำแหน่ง', g:GRAY, fn:resetPanel},

/* ---------- loop & stereo rendering ---------- */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = (S.stereo ? (w/2) : w) / h;
  camera.updateProjectionMatrix();
  hud.style.display = S.stereo ? 'none' : 'block';
  vrDivider.style.display = S.stereo ? 'block' : 'none';
}

function render(){
  const w = innerWidth, h = innerHeight;
  if (S.stereo){
    camera.updateMatrixWorld();
    
    // ตั้งค่า Stereo convergence (ระยะโฟกัสที่รวมสายตา)
    stereo.eyeSep = S.ipd;
    stereo.focus = PANEL_R; // ป้องกันภาพซ้อน: จุดโฟกัสตัดกันที่ระยะแผง UI (~2m) พอดี
    stereo.update(camera);
    
    renderer.setScissorTest(true);
    
    // Left Eye
    renderer.setViewport(0, 0, Math.floor(w/2), h);
    renderer.setScissor(0, 0, Math.floor(w/2), h);
    renderer.render(scene, stereo.cameraL);
    
    // Right Eye
    renderer.setViewport(Math.floor(w/2), 0, Math.ceil(w/2), h);
    renderer.setScissor(Math.floor(w/2), 0, Math.ceil(w/2), h);
    renderer.render(scene, stereo.cameraR);
    
    renderer.setScissorTest(false);
  } else {
    renderer.setViewport(0, 0, w, h);
    renderer.render(scene, camera);
  }
}

let last = 0, fpsN = 0, fpsT = 0, lowT = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now - last)/1000, 0.1); last = now;
  if (N.webOpen && !N.webFloat) return;
  camera.quaternion.copy(devQ); camera.updateMatrixWorld(true);
  updateLight(now);
  if (N.boosting && S.mr && video.currentTime !== N.drawnVT) boostFrame();
  updateHands(now);
  easeCursor(dt);
  interact(now, dt);
  syncPanelGeo();
  updateHandViz();
  updateHand2Viz();
  if (toast.mesh.visible){
    if (now > N.msgUntil) toast.mesh.visible = false;
    else toast.mesh.position.set(0, dock.mesh.position.y + 0.24, -DOCK_R + 0.02);
  }
  wins.forEach(w => {
    if (!w.ui.mesh.visible) return;
    if (w.tick && now - w.lt > w.tick){ w.lt = now; w.ui.dirty = true; }
    if (w.vmat && videoTex && !w.vmat.map){ w.vmat.map = videoTex; w.vmat.color.set(0xffffff); w.vmat.needsUpdate = true; w.ui.dirty = true; }
  });
  if (S.mode === 'v360'){
    v360g.rotation.set(v360.pitch, v360.base + v360.yaw, 0);
    if (Math.abs(camera.fov - v360.fov) > 0.05){ camera.fov = v360.fov; camera.updateProjectionMatrix(); }
  }
  [panel, dock, toast].concat(wins.map(w => w.ui)).forEach(u => { if (u.dirty && u.mesh.visible && now - (u.lastDraw || 0) > 90){ u.lastDraw = now; u.redraw(); } });

  if (S.mode === 'shoot'){
    spawnAcc += dt; if (spawnAcc > 1.1){ spawnAcc = 0; spawnTarget(); }
    targets.slice().forEach(t => { if (now - t.userData.born > 7000) popTarget(t); });
  } else if (S.mode === 'gallery'){
    galleryItems.forEach(m => { m.rotation.y += dt*m.userData.spd; m.rotation.x += dt*0.3*m.userData.spd; });
  }
  render();

  fpsN++; fpsT += dt;
  if (fpsT > 0.5){
    hud.textContent = VERSION + ' | ' + Math.round(fpsN/fpsT) + ' fps | hand: ' + (H.ok ? (H.fist ? 'fist' : (H.pinch ? 'pinch' : 'ok')) : 'none') + ' (' + delegate + ', det ' + D.ms.toFixed(0) + 'ms/' + (detGap ? Math.round(1000/Math.max(detGap,1)) : 0) + 'Hz)\nmode: ' + S.mode + ' | q: ' + QNAMES[S.qi] + ' | ui x' + S.pscale.toFixed(2) + '\nlight ' + Math.round(N.lum) + ' x' + N.gain.toFixed(1) + (N.torchOn ? ' | torch' : '') + (gotOrient ? '' : ' | no gyro') + (H.zoom ? ' | 2 มือ' : '') + '\nสองมือ: ' + (P.two ? 'เปิด' : 'ปิด') + ' | เจอมือ ' + (H.ok ? (H.n || 0) : 0) + (delegate === '-' ? '\nกำลังโหลดโมเดลมือ…' : '') + (delegate === 'fail' ? '\nโหลดโมเดลมือไม่ได้: ' + initErr.slice(0, 90) : '');
    const fpsNow = fpsN/fpsT;
    if (fpsNow < 20 && S.qi > 0 && S.cam !== undefined){ lowT += 0.5; if (lowT >= 2.5){ S.qi--; applyQuality(); savePrefs(); invalidateUI(); lowT = 0; } } else lowT = 0;
    fpsN = 0; fpsT = 0;
  }
}

/* ---------- start ---------- */
addEventListener('resize', resize);

// browser overlay buttons
$('wgo').onclick = () => openWeb($('wurl').value);
$('wurl').addEventListener('keydown', e => { if (e.key === 'Enter') openWeb($('wurl').value); });
$('wh').onclick = () => { if (N.webUrl) $('wframe').src = N.webUrl; };
$('wx').onclick = () => { window.open($('wurl').value || N.webUrl, '_blank', 'noopener'); };
$('wc').onclick = closeWeb;
$('wf').onclick = () => {
  N.webFloat = (N.webFloat + 1) % 3;
  $('web').classList.toggle('fl1', N.webFloat === 1); $('web').classList.toggle('fl2', N.webFloat === 2);
};
document.addEventListener('pointerdown', () => { if (N.pendingFn) N.swallow = true; }, true);
document.addEventListener('click', () => {
  if (!N.pendingFn) return;
  const fn = N.pendingFn; N.pendingFn = null; N.swallow = false; fn();
}, true);

document.addEventListener('pointerdown', () => {
  if (!N.pending) return;
  const u = N.pending; N.pending = null; N.swallow = true;
  setTimeout(() => { N.swallow = false; }, 80);
  window.location.href = u;
}, true);

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !S.cam) return;
  try{ if (N.track && N.track.readyState === 'ended') await initCamera(); else await video.play(); }catch(e){}
  try{ if (navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){}
});

$('go').onclick = async () => {
  $('msg').textContent = 'กำลังเริ่ม...';
  try{ if (DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); }catch(e){}
  addEventListener('deviceorientation', onOrient, true);
  try{ await document.documentElement.requestFullscreen(); await screen.orientation.lock('landscape'); }catch(e){}
  try{ if (navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){}
  await initCamera();
  initHands();
  $('start').remove();
  groups.shoot.visible = false; groups.gallery.visible = false; panel.mesh.visible = true;
  applyQuality(); recenterHeading(); drawScore(); invalidateUI();
  requestAnimationFrame(frame);
};
</script>
