<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>PocketVR</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10121a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;touch-action:manipulation}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
video{position:fixed;left:-10px;top:0;width:2px;height:2px;pointer-events:none}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#0b1220;z-index:5;text-align:center;padding:20px}
#start button{font-size:20px;padding:14px 36px;border-radius:30px;border:0;background:#4f8cff;color:#fff}
#start p{margin:0;opacity:.85;line-height:1.5}
#hud{position:fixed;left:8px;top:6px;font:11px monospace;opacity:.7;z-index:3;white-space:pre;pointer-events:none}
#web{position:fixed;left:6%;right:6%;top:5%;bottom:5%;z-index:4;display:flex;flex-direction:column;background:#1e1e21;border-radius:18px;overflow:hidden;touch-action:auto;box-shadow:0 0 0 2px #3a3a3f}
#web[hidden]{display:none}
#wbar{display:flex;gap:6px;padding:6px;align-items:center;background:#2a2a2e}
#wbar button{border:0;border-radius:12px;background:#3d3d43;color:#fff;font-size:18px;min-width:44px;height:40px}
#wbar button:active{background:#5a5a64}
#wurl{flex:1;min-width:0;height:40px;border:0;border-radius:12px;background:#111;color:#fff;padding:0 12px;font-size:15px}
#wframe{flex:1;border:0;background:#fff;touch-action:auto}
</style>
</head>
<body>
<div id="start">
  <h2 style="margin:0">PocketVR</h2>
  <p>หมุนจอเป็นแนวนอน แล้วกดเริ่ม<br>อนุญาตกล้อง + เซนเซอร์เมื่อถูกถาม</p>
  <button id="go">เริ่ม</button>
  <p id="msg" style="font-size:13px"></p>
</div>
<div id="hud"></div>
<div id="web" hidden>
  <div id="wbar">
    <button id="wh" title="หน้าแรกของเว็บนี้">⌂</button>
    <input id="wurl" type="text" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false">
    <button id="wgo">ไป</button>
    <button id="wx" title="เปิดในแท็บใหม่">↗</button>
    <button id="wc" title="ปิด">✕</button>
  </div>
  <iframe id="wframe" referrerpolicy="no-referrer" allow="fullscreen; autoplay; clipboard-write" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"></iframe>
</div>
<video id="cam" playsinline muted autoplay></video>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
<script type="module">
import {HandLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const VERSION = 'v3.5';
const $ = id => document.getElementById(id);
const hud = $('hud'), video = $('cam');
const BG = 0x0b1220;
const IPDS = [0.058, 0.063, 0.068];
const QUAL = [0.75, 1, 1.5], QNAMES = ['ประหยัด', 'ปกติ', 'คมชัด'];
const S = {mr:false, stereo:false, ipd:0.063, mode:'home', tab:'all', score:0, cam:false, qi:1, pscale:1.15, page:0};

/* --- dark-room support --- */
const NMODES = ['ปิด', 'อัตโนมัติ', 'สว่างสุด'], TMODES = ['ปิด', 'เปิด', 'อัตโนมัติ'];
const N = {mode:1, tm:0, lum:128, gain:1, gainT:1, dark:false, boosting:false, warn:false,
           torchOK:false, torchOn:false, ev:0, expCap:null, track:null, lastProbe:0, drawnVT:-1,
           pending:null, swallow:false, webOpen:false, webUrl:'', msg:'', msgUntil:0};
const HAS_FILTER = 'filter' in CanvasRenderingContext2D.prototype;
const probeCv = document.createElement('canvas'); probeCv.width = 32; probeCv.height = 18;
const probeCtx = probeCv.getContext('2d', {willReadFrequently:true});
const boostCv = document.createElement('canvas'); boostCv.width = 960; boostCv.height = 540;
const bctx = boostCv.getContext('2d');
let boostTex = null;

/* --- phone apps (launched through Android deep links) and web shortcuts --- */
const APPS = [
  {n:'YouTube',     i:'▶️', pkg:'com.google.android.youtube',      link:'https://www.youtube.com/'},
  {n:'Spotify',     i:'🎵', pkg:'com.spotify.music',               link:'spotify://'},
  {n:'LINE',        i:'💬', pkg:'jp.naver.line.android',           link:'line://'},
  {n:'Facebook',    i:'📘', pkg:'com.facebook.katana',             link:'fb://'},
  {n:'Messenger',   i:'✉️', pkg:'com.facebook.orca',               link:'fb-messenger://'},
  {n:'Instagram',   i:'📷', pkg:'com.instagram.android',           link:'https://www.instagram.com/'},
  {n:'TikTok',      i:'🎬', pkg:'com.zhiliaoapp.musically',        link:'https://www.tiktok.com/'},
  {n:'Netflix',     i:'🍿', pkg:'com.netflix.mediaclient',         link:'https://www.netflix.com/'},
  {n:'Google Maps', i:'🗺', pkg:'com.google.android.apps.maps',    link:'https://maps.google.com/'},
  {n:'Discord',     i:'🎧', pkg:'com.discord',                     link:'https://discord.com/'}
];
const WEBS = [
  {n:'Wikipedia',     i:'📚', url:'https://th.wikipedia.org/'},
  {n:'แผนที่ OSM',    i:'🗺', url:'https://www.openstreetmap.org/export/embed.html?bbox=100.45%2C13.65%2C100.65%2C13.85&layer=mapnik'},
  {n:'DuckDuckGo',    i:'🔎', url:'https://html.duckduckgo.com/html/'}
];
const BLOCKED_SCHEMES = /^(javascript|data|file|blob|about|vbscript):/i;
function loadList(k){ try{ const v = JSON.parse(localStorage.getItem(k) || '[]'); return Array.isArray(v) ? v : []; }catch(e){ return []; } }
function saveList(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let customApps = loadList('pvr_apps'), customWebs = loadList('pvr_webs');

/* --- tunables --- */
const PINCH_SETS = [[0.18, 0.30, 'แน่น'], [0.22, 0.34, 'กลาง'], [0.28, 0.42, 'หลวม']];   // [start, release, label]: thumb-index distance / palm size
const SMOOTH = [[2.5, 4, 'ไว'], [1.2, 3, 'กลาง'], [0.6, 2.5, 'นุ่ม']];                    // One-Euro filter [minCutoff, beta, label]
const RATE_MS = [33, 50, 80], RATE_N = ['เร็ว', 'กลาง', 'ประหยัด'];                          // minimum gap between hand detections
const GAZE_N = ['ปิด', 'เปิด', 'เฉพาะแบ่งจอ'], PTR_N = ['ปลายนิ้วชี้', 'กึ่งกลางนิ้วจีบ'], DEV_N = ['GPU', 'CPU'];
const LOST_MS = 650;      // keep the last hand pose this long after a missed detection
const HOLD_R = 0.45;      // while closing the fingers below this, the cursor stops moving (so it doesn't drift)
const HIT_SLOP = 8;       // extra px around every button (logical UI px)
const HAND_D = 1.1;       // distance (m) where the hand skeleton is drawn
const PANEL_R = 2.2, DOCK_R = 2.0;
const BASE_W = 2.0, BASE_H = 1.1;   // panel size (m) at scale 1
const PS_MIN = 0.6, PS_MAX = 2.0;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* --- saved preferences --- */
const P = {gaze:0, ptr:0, smooth:1, rate:1, pinch:1, dev:0};
function loadPrefs(){
  try{
    const o = JSON.parse(localStorage.getItem('pvr_prefs') || '{}');
    for (const k of Object.keys(P)) if (Number.isInteger(o[k]) && o[k] >= 0) P[k] = o[k];
    P.gaze = Math.min(P.gaze, 2); P.ptr = Math.min(P.ptr, 1); P.smooth = Math.min(P.smooth, 2);
    P.rate = Math.min(P.rate, 2); P.pinch = Math.min(P.pinch, 2); P.dev = Math.min(P.dev, 1);
    if (Number.isInteger(o.qi) && o.qi >= 0) S.qi = Math.min(o.qi, 2);
    if (Number.isInteger(o.nm) && o.nm >= 0) N.mode = Math.min(o.nm, 2);
    if (IPDS.includes(o.ipd)) S.ipd = o.ipd;
  }catch(e){}
}
function savePrefs(){
  try{ localStorage.setItem('pvr_prefs', JSON.stringify(Object.assign({}, P, {qi:S.qi, nm:N.mode, ipd:S.ipd}))); }catch(e){}
}
loadPrefs();

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 6, 22);
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 50);
scene.add(camera);
const stereo = new THREE.StereoCamera();

scene.add(new THREE.HemisphereLight(0xffffff, 0x334466, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(1, 2, 1); scene.add(sun);

const env = new THREE.Group(); scene.add(env);
const grid = new THREE.GridHelper(30, 30, 0x4f8cff, 0x1c2b4a); grid.position.y = -1.6; env.add(grid);

const heading = new THREE.Group(); scene.add(heading);
const groups = {shoot:new THREE.Group(), gallery:new THREE.Group()};
Object.values(groups).forEach(g => heading.add(g));

function applyQuality(){
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, QUAL[S.qi]));
  resize();
}

/* ---------- canvas UI toolkit ---------- */
function roundRect(x, a, b, w, h, r){
  x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r);
  x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath();
}
// W,H = logical size used by the drawing code; k = texture sharpness multiplier
function makeUI(W, H, k, draw){
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(W*k); canvas.height = Math.round(H*k);
  const ctx = canvas.getContext('2d');
  const tex = new THREE.CanvasTexture(canvas);
  tex.generateMipmaps = false; tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.anisotropy = 1;
  const ui = {W, H, ctx, tex, regions:[], hover:null, press:null, dirty:true, mesh:null};
  ui.mat = new THREE.MeshBasicMaterial({map:tex, transparent:true, side:THREE.DoubleSide, fog:false, depthWrite:false});
  ui.reg = (id, x, y, w, h, fn) => ui.regions.push({id, x, y, w, h, fn});
  ui.redraw = () => {
    ui.regions.length = 0;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    draw(ctx, ui);
    tex.needsUpdate = true; ui.dirty = false;
  };
  ui.at = uv => {
    const cx = uv.x*W, cy = (1-uv.y)*H;
    for (let i = ui.regions.length-1; i >= 0; i--){
      const r = ui.regions[i];
      if (cx >= r.x-HIT_SLOP && cx <= r.x+r.w+HIT_SLOP && cy >= r.y-HIT_SLOP && cy <= r.y+r.h+HIT_SLOP) return r;
    }
    return null;
  };
  return ui;
}
function invalidateUI(){ panel.dirty = true; dock.dirty = true; }

/* ---------- actions ---------- */
function toggleMR(){ if (!S.cam) return; setMR(!S.mr); invalidateUI(); }
function toggleSplit(){ S.stereo = !S.stereo; resize(); invalidateUI(); }
function cycleIPD(){ S.ipd = IPDS[(IPDS.indexOf(S.ipd)+1) % IPDS.length]; savePrefs(); invalidateUI(); }
function cycleQuality(){ S.qi = (S.qi + 1) % QUAL.length; applyQuality(); savePrefs(); invalidateUI(); }
function zoomPanel(f){ S.pscale = clamp(S.pscale*f, PS_MIN, PS_MAX); }
function showToast(msg, ms){
  N.msg = msg; N.msgUntil = performance.now() + (ms || 3500);
  if (typeof toast !== 'undefined'){ toast.dirty = true; toast.mesh.visible = true; }
}
function buildIntent(a){
  const link = (a.link || '').trim();
  if (!link || BLOCKED_SCHEMES.test(link)) return null;
  const m = link.match(/^([a-z][a-z0-9+.\-]*):\/\/(.*)$/i);
  if (!m || !a.pkg) return link;
  const fb = 'https://play.google.com/store/apps/details?id=' + a.pkg;
  return 'intent://' + m[2] + '#Intent;scheme=' + m[1].toLowerCase() + ';package=' + a.pkg + ';S.browser_fallback_url=' + encodeURIComponent(fb) + ';end';
}
// Chrome only follows intent: links right after a real touch, so a hand gesture alone may be refused
function go(url){
  if (navigator.userActivation && !navigator.userActivation.isActive){
    N.pending = url; showToast('แตะจอ 1 ครั้งเพื่อเปิดแอป', 6000); return;
  }
  window.location.href = url;
}
function launchApp(a){
  const u = buildIntent(a);
  if (!u){ showToast('ลิงก์แอปไม่ถูกต้อง'); return; }
  showToast('กำลังเปิด ' + a.n + '…', 2500);
  go(u);
}
function addApp(){
  const n = (prompt('ชื่อแอป (เช่น YouTube)') || '').trim(); if (!n) return;
  const pkg = (prompt('ชื่อแพ็กเกจ (เช่น com.google.android.youtube)\nเว้นว่างได้ถ้าลิงก์เปิดแอปได้อยู่แล้ว') || '').trim();
  const link = (prompt('ลิงก์ที่แอปรองรับ\nเช่น https://www.youtube.com/ หรือ line://') || '').trim();
  if (!link || BLOCKED_SCHEMES.test(link) || !/^[a-z][a-z0-9+.\-]*:\/\//i.test(link)){ showToast('ลิงก์ไม่ถูกต้อง'); return; }
  customApps.push({n, pkg, link, i:'📱', custom:true}); saveList('pvr_apps', customApps); invalidateUI();
}
function clearApps(){ if (confirm('ลบแอปที่เพิ่มเองทั้งหมด?')){ customApps = []; saveList('pvr_apps', customApps); S.page = 0; invalidateUI(); } }
function normUrl(u){
  u = (u || '').trim(); if (!u) return null;
  if (/^https?:\/\//i.test(u)) return u;
  if (BLOCKED_SCHEMES.test(u)) return null;
  if (/^[^\s\/]+\.[^\s]+$/.test(u)) return 'https://' + u;
  return 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(u);
}
function openWeb(url){
  const u = normUrl(url); if (!u){ showToast('URL ไม่ถูกต้อง'); return; }
  if (S.stereo){ S.stereo = false; resize(); invalidateUI(); }
  N.webUrl = u; $('wurl').value = u; $('wframe').src = u;
  $('web').hidden = false; N.webOpen = true;
}
function closeWeb(){
  $('web').hidden = true; $('wframe').src = 'about:blank'; N.webOpen = false; invalidateUI();
}
function addWeb(){
  const n = (prompt('ชื่อเว็บ') || '').trim(); if (!n) return;
  const url = normUrl(prompt('URL (เช่น https://th.wikipedia.org)') || ''); if (!url){ showToast('URL ไม่ถูกต้อง'); return; }
  customWebs.push({n, url, i:'🌐', custom:true}); saveList('pvr_webs', customWebs); invalidateUI();
}
function askWeb(){ const u = prompt('พิมพ์ URL หรือคำค้นหา'); if (u) openWeb(u); }
function clearWebs(){ if (confirm('ลบเว็บที่เพิ่มเองทั้งหมด?')){ customWebs = []; saveList('pvr_webs', customWebs); S.page = 0; invalidateUI(); } }
function setTorch(on){
  if (!N.track || !N.torchOK) return;
  N.track.applyConstraints({advanced:[{torch:on}]})
    .then(() => { N.torchOn = on; invalidateUI(); })
    .catch(() => { N.torchOK = false; N.torchOn = false; invalidateUI(); });
}
function applyTorch(){
  if (!N.torchOK) return;
  if (N.tm === 1 && !N.torchOn) setTorch(true);
  else if (N.tm === 0 && N.torchOn) setTorch(false);
}
function cycleTorch(){ if (!N.torchOK) return; N.tm = (N.tm + 1) % 3; applyTorch(); invalidateUI(); }
function quickTorch(){ if (!N.torchOK) return; N.tm = (N.tm === 1) ? 0 : 1; applyTorch(); invalidateUI(); }
function cycleNight(){ N.mode = (N.mode + 1) % 3; N.lastProbe = 0; savePrefs(); invalidateUI(); }
function cycleP(k, n){ P[k] = (P[k] + 1) % n; savePrefs(); invalidateUI(); }
function cycleGaze(){ cycleP('gaze', 3); }
function cyclePtr(){ cycleP('ptr', 2); }
function cycleSmooth(){ cycleP('smooth', 3); }
function cycleRate(){ cycleP('rate', 3); }
function cyclePinch(){ cycleP('pinch', 3); }
function cycleDev(){ cycleP('dev', 2); showToast('เปลี่ยนตัวประมวลผลแทร็กมือ…', 2500); reinitHands(); }
async function reinitHands(){
  try{ if (landmarker){ landmarker.close(); landmarker = null; } }catch(e){ landmarker = null; }
  H.ok = false; H.lm = null; H.pinch = false; H.fist = false;
  await initHands();
  invalidateUI();
}
function resetSettings(){
  Object.assign(P, {gaze:0, ptr:0, smooth:1, rate:1, pinch:1, dev:0});
  S.qi = 1; N.mode = 1; S.ipd = 0.063; N.lastProbe = 0;
  applyQuality(); savePrefs(); invalidateUI(); showToast('รีเซ็ตการตั้งค่าแล้ว', 2500);
  reinitHands();
}
function applyExposure(){
  if (!N.track || !N.expCap) return;
  const c = N.expCap;
  let v = N.ev ? c.max * 0.85 : 0;
  if (c.step) v = Math.round(v / c.step) * c.step;
  v = clamp(v, c.min, c.max);
  N.track.applyConstraints({advanced:[{exposureCompensation:v}]}).catch(() => {});
}
function applyBackground(){
  if (!S.mr) return;
  scene.background = (N.boosting && boostTex) ? boostTex : videoTex;
}
function resetPanel(){
  recenterHeading();
  panelPivot.rotation.y = 0; panelPivot.position.y = 0.12; S.pscale = 1.15;
  dockPivot.rotation.y = 0; dock.mesh.position.y = -0.72;
}

/* ---------- app panel (Quest Home style) ---------- */
const PW = 1024, PH = 563;
const NAV = [['all','▦','ทั้งหมด','แอปและเครื่องมือ'], ['apps','🎮','แอปและเกม','แอปและเกม'], ['phone','📱','แอปในเครื่อง','แอปในเครื่อง'], ['web','🌐','เว็บ','เว็บไซต์'], ['settings','⚙','ตั้งค่า','ตั้งค่า']];
const GRAY = ['#56565e','#38383e'];
const CARDS = {
  shoot:   {icon:'🎯', t:'ยิงเป้า',      sub:() => 'เกม',  g:['#ff7a6b','#b8372a'], fn:() => setMode('shoot')},
  gallery: {icon:'🖼', t:'ห้องจัดแสดง',  sub:() => 'แอป',  g:['#5a95ff','#2a4fa8'], fn:() => setMode('gallery')},
  mr:      {icon:'📷', t:'ภาพจริง (MR)', sub:() => S.mr ? 'เปิดอยู่' : 'ปิดอยู่', on:() => S.mr, g:GRAY, fn:toggleMR},
  split:   {icon:'🥽', t:'แบ่งจอ VR',    sub:() => S.stereo ? 'เปิดอยู่' : 'ปิดอยู่', on:() => S.stereo, g:GRAY, fn:toggleSplit},
  ipd:     {icon:'↔', t:'ระยะตา',       sub:() => Math.round(S.ipd*1000) + ' mm', g:GRAY, fn:cycleIPD},
  quality: {icon:'✨', t:'คุณภาพภาพ',    sub:() => QNAMES[S.qi], g:GRAY, fn:cycleQuality},
  night:   {icon:'🌙', t:'โหมดมืด',      sub:() => NMODES[N.mode] + (N.boosting ? ' ×' + N.gain.toFixed(1) : ''), on:() => N.boosting, g:GRAY, fn:cycleNight},
  torch:   {icon:'🔦', t:'ไฟฉาย',        sub:() => N.torchOK ? TMODES[N.tm] : 'ไม่รองรับ', on:() => N.torchOn, g:GRAY, fn:cycleTorch},
  center:  {icon:'⌖', t:'จัดกลางใหม่',  sub:() => 'รีเซ็ตตำแหน่ง', g:GRAY, fn:resetPanel}
};
const TABS = {all:['shoot','gallery','mr','split','night','torch'], apps:['shoot','gallery'], tools:['mr','split','ipd','quality','night','torch']};

const SETS = [
  {id:'mr',      t:'ภาพจริง (MR)',        v:() => S.mr ? 'เปิด' : 'ปิด',          on:() => S.mr,       fn:toggleMR},
  {id:'split',   t:'แบ่งจอ VR',           v:() => S.stereo ? 'เปิด' : 'ปิด',      on:() => S.stereo,   fn:toggleSplit},
  {id:'ipd',     t:'ระยะตา',              v:() => Math.round(S.ipd*1000) + ' mm', on:() => false,      fn:cycleIPD},
  {id:'quality', t:'คุณภาพภาพ',           v:() => QNAMES[S.qi],                   on:() => false,      fn:cycleQuality},
  {id:'gaze',    t:'เคอร์เซอร์กลางจอ',    v:() => GAZE_N[P.gaze],                 on:() => P.gaze > 0, fn:cycleGaze},
  {id:'night',   t:'โหมดมืด',             v:() => NMODES[N.mode],                 on:() => N.mode > 0, fn:cycleNight},
  {id:'torch',   t:'ไฟฉาย',               v:() => N.torchOK ? TMODES[N.tm] : 'ไม่รองรับ', on:() => N.torchOn, fn:cycleTorch},

// One-Euro filter: smooth when the hand is slow, responsive when it moves fast
class OneEuro{
  constructor(){ this.x = null; this.dx = 0; this.t = 0; }
  reset(){ this.x = null; }
  static alpha(fc, te){ const tau = 1 / (2*Math.PI*fc); return 1 / (1 + tau/te); }
  filter(v, t, minC, beta){
    if (this.x === null){ this.x = v; this.dx = 0; this.t = t; return v; }
    const te = Math.max((t - this.t)/1000, 0.001); this.t = t;
    this.dx += OneEuro.alpha(1.0, te) * ((v - this.x)/te - this.dx);
    this.x += OneEuro.alpha(minC + beta*Math.abs(this.dx), te) * (v - this.x);
    return this.x;
  }
}

  H.px += (H.ptx - H.px)*k; H.py += (H.pty - H.py)*k;

  if (now - N.lastProbe > 900){
    N.lastProbe = now;
    probeCtx.drawImage(video, 0, 0, 32, 18);
    const d = probeCtx.getImageData(0, 0, 32, 18).data;
    let sum = 0;
    for (let i = 0; i < d.length; i += 4) sum += d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
    N.lum = sum / (d.length/4);
    if (!N.dark && N.lum < 70) N.dark = true; else if (N.dark && N.lum > 105) N.dark = false;
    if (N.tm === 2 && N.torchOK && !N.torchOn && N.lum < 28) setTorch(true);   // auto torch: switches on in very dark rooms
    const wantEV = N.mode === 2 ? 1 : 0;
    if (wantEV !== N.ev){ N.ev = wantEV; applyExposure(); }
    let tg = 1;
    if (N.mode === 2) tg = clamp(150 / Math.max(N.lum, 8), 1.5, 8);
    else if (N.mode === 1 && N.dark) tg = clamp(110 / Math.max(N.lum, 8), 1.5, 6);
    N.gainT = tg;
    const warn = N.lum < 20 && !N.torchOn && N.torchOK;
    if (warn !== N.warn){ N.warn = warn; dock.dirty = true; }
  }
  N.gain += (N.gainT - N.gain) * 0.25;
  const b = N.gain > 1.15;
  if (b !== N.boosting){ N.boosting = b; invalidateUI(); applyBackground(); }
}
// brightened copy of the camera frame (used for hand detection and, in MR, as the background)
function boostFrame(){
  const vw = video.videoWidth || 640, vh = video.videoHeight || 360;
  const w = Math.min(vw, 960), h = Math.round(w * vh / vw);
  if (boostCv.width !== w || boostCv.height !== h){ boostCv.width = w; boostCv.height = h; }
  if (HAS_FILTER){
    bctx.filter = 'brightness(' + N.gain.toFixed(2) + ') contrast(1.12)';
    bctx.drawImage(video, 0, 0, w, h);
  } else {
    bctx.globalCompositeOperation = 'source-over';
    bctx.drawImage(video, 0, 0, w, h);
    bctx.globalCompositeOperation = 'lighter';
    for (let i = 0, n = Math.max(0, Math.round(N.gain) - 1); i < n; i++) bctx.drawImage(video, 0, 0, w, h);
    bctx.globalCompositeOperation = 'source-over';
  }
  if (boostTex) boostTex.needsUpdate = true;
  N.drawnVT = video.currentTime;
}
const dist2 = (a, b) => Math.hypot(a.x-b.x, a.y-b.y);
const TIPS = [8,12,16,20], PIPS = [6,10,14,18];
function updateHands(now){
  if (!landmarker || !S.cam || video.readyState < 2 || video.currentTime === lastVT) return;
  detGap = Math.max(RATE_MS[P.rate], D.ms * 2.2);   // keep detection under ~45% of the frame budget
  if (now - lastDet < detGap) return;
  lastVT = video.currentTime; lastDet = now;
  let src = video;
  if (N.boosting){ if (N.drawnVT !== video.currentTime) boostFrame(); src = boostCv; }
  const t0 = performance.now();
  const sw = src.videoWidth || src.width || 640, sh = src.videoHeight || src.height || 360;
  detCv.height = Math.round(384 * sh / sw);
  dctx.drawImage(src, 0, 0, 384, detCv.height);
  let r; try{ r = landmarker.detectForVideo(detCv, now); }catch(e){ return; }
  D.ms += ((performance.now() - t0) - D.ms) * 0.2;
  const lm = r.landmarks && r.landmarks[0];
  if (!lm){ if (now - H.lastSeen > LOST_MS){ H.ok = false; H.lm = null; H.pinch = false; H.fist = false; } return; }
  const fresh = !H.ok;
  H.ok = true; H.lastSeen = now; H.lm = lm;
  if (fresh){ F.x.reset(); F.y.reset(); F.px.reset(); F.py.reset(); }
  const sm = SMOOTH[P.smooth], pn = PINCH_SETS[P.pinch];

  // fist = all four fingertips folded closer to the wrist than their middle joints
  let curled = 0;
  for (let i = 0; i < 4; i++) if (dist2(lm[TIPS[i]], lm[0]) < dist2(lm[PIPS[i]], lm[0]) * 0.95) curled++;
  if (!H.fist && curled >= 4) H.fist = true; else if (H.fist && curled <= 2) H.fist = false;

  // palm centre (the pointer while making a fist)
  H.ptx = F.px.filter(lm[9].x*2-1, now, sm[0], sm[1]);
  H.pty = F.py.filter(-(lm[9].y*2-1), now, sm[0], sm[1]);

  // pointer: index fingertip (default) or the midpoint between thumb and index tips
  const rx = P.ptr === 0 ? lm[8].x*2-1 : (lm[4].x + lm[8].x) - 1;
  const ry = P.ptr === 0 ? -(lm[8].y*2-1) : -((lm[4].y + lm[8].y) - 1);
  const nx = F.x.filter(rx, now, sm[0], sm[1]), ny = F.y.filter(ry, now, sm[0], sm[1]);
  const ratio = dist2(lm[4], lm[8]) / (dist2(lm[0], lm[9]) || 1e-3);
  if (fresh){ H.tx = H.x = nx; H.ty = H.y = ny; H.px = H.ptx; H.py = H.pty; }

  const was = H.pinch;
  let pinch = was;
  if (H.fist) pinch = false;
  else if (!pinch && ratio < pn[0]) pinch = true;
  else if (pinch && ratio > pn[1]) pinch = false;

  if (pinch && !was) H.a = {nx, ny, cx:H.tx, cy:H.ty};          // remember where the cursor was when the pinch began
  if (pinch && H.a){                                            // while pinching: only follow the hand's movement
    H.tx = H.a.cx + (nx - H.a.nx); H.ty = H.a.cy + (ny - H.a.ny);
  } else if (ratio > HOLD_R){                                   // fingers apart: follow normally
    H.tx = nx; H.ty = ny;
  }                                                             // fingers closing: hold still so small targets don't slip away
  H.pinch = pinch;
}

/* ---------- 3D hand skeleton + pinch ray ---------- */
const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const handViz = new THREE.Group(); handViz.visible = false; camera.add(handViz);
const jointMat = new THREE.PointsMaterial({color:0xe6e8ef, size:0.018, sizeAttenuation:true, fog:false});
const tipMat = new THREE.MeshBasicMaterial({color:0xffffff, fog:false});
const jointPts = new THREE.Points(new THREE.BufferGeometry(), jointMat);
jointPts.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(63), 3));
jointPts.frustumCulled = false; handViz.add(jointPts);
const boneLines = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({color:0xcfd3de, fog:false}));
boneLines.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(CONN.length*6), 3));
boneLines.frustumCulled = false; handViz.add(boneLines);
const tipGeo = new THREE.SphereGeometry(0.016, 8, 6);
const tipA = new THREE.Mesh(tipGeo, tipMat), tipB = new THREE.Mesh(tipGeo, tipMat);
handViz.add(tipA); handViz.add(tipB);
const rayMat = new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.55, depthTest:false, fog:false});
const rayBone = new THREE.Mesh(new THREE.CylinderGeometry(0.0025, 0.0025, 1, 4, 1), rayMat);
rayBone.renderOrder = 998; rayBone.visible = false; scene.add(rayBone);
const hs = Array.from({length:21}, () => new THREE.Vector3());
let hsInit = false;
const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _d = new THREE.Vector3(), UP = new THREE.Vector3(0,1,0);
function placeBone(mesh, a, b){
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  _d.subVectors(b, a); const len = _d.length() || 1e-4;
  mesh.scale.set(1, len, 1);
  mesh.quaternion.setFromUnitVectors(UP, _d.multiplyScalar(1/len));
}
function updateHandViz(){
  if (!H.ok || !H.lm){ handViz.visible = false; rayBone.visible = false; hsInit = false; return; }
  handViz.visible = true;
  const tH = Math.tan(THREE.MathUtils.degToRad(camera.fov/2)), asp = camera.aspect;
  for (let i = 0; i < 21; i++){
    const l = H.lm[i];
    const depth = Math.min(2, Math.max(0.5, HAND_D + l.z*2.5));
    const tx = (l.x*2-1) * tH * asp * depth, ty = -(l.y*2-1) * tH * depth, tz = -depth;
    if (!hsInit) hs[i].set(tx, ty, tz);
    else { hs[i].x += (tx - hs[i].x)*0.5; hs[i].y += (ty - hs[i].y)*0.5; hs[i].z += (tz - hs[i].z)*0.5; }
  }
  hsInit = true;
  const jp = jointPts.geometry.attributes.position.array, bp = boneLines.geometry.attributes.position.array;
  for (let i = 0; i < 21; i++){ jp[i*3] = hs[i].x; jp[i*3+1] = hs[i].y; jp[i*3+2] = hs[i].z; }
  CONN.forEach((c, i) => { const p = hs[c[0]], q = hs[c[1]]; bp.set([p.x,p.y,p.z,q.x,q.y,q.z], i*6); });
  jointPts.geometry.attributes.position.needsUpdate = true; boneLines.geometry.attributes.position.needsUpdate = true;
  tipA.position.copy(hs[4]); tipB.position.copy(hs[8]);
  tipMat.color.set(H.pinch ? 0x39e08a : (H.fist ? 0x4f8cff : 0xffffff));
  if (H.fist) _a.copy(hs[9]); else _a.copy(hs[4]).add(hs[8]).multiplyScalar(0.5);
  handViz.localToWorld(_a);
  _b.copy(cursor.position);
  placeBone(rayBone, _a, _b);
  rayMat.color.set(H.pinch ? 0x39e08a : (H.fist ? 0x4f8cff : 0xffffff));
  rayBone.visible = true;
}

/* ---------- interaction: hand / gaze dwell / tap ---------- */
const ray = new THREE.Raycaster();
const cursor = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 10),
  new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, depthTest:false, depthWrite:false, fog:false}));
cursor.renderOrder = 999; scene.add(cursor);
let hoverKey = null, hoverT = 0, wasPinch = false, wasFist = false, cool = 0, tap = null, grab = null;
renderer.domElement.addEventListener('pointerdown', e => {
  if (N.swallow){ N.swallow = false; return; }
  tap = {x:e.clientX/innerWidth*2-1, y:-(e.clientY/innerHeight)*2+1};
});

const _dir = new THREE.Vector3(), Yaxis = new THREE.Vector3(0,1,0);
function rayYawY(R){
  _dir.copy(ray.ray.direction).applyAxisAngle(Yaxis, -heading.rotation.y);
  const hl = Math.hypot(_dir.x, _dir.z) || 1e-3;
  return {yaw:Math.atan2(_dir.x, -_dir.z), y:_dir.y / hl * R};
}
function startGrab(kind, target, type){
  const R = target === 'dock' ? DOCK_R : PANEL_R, r = rayYawY(R);
  grab = {kind, target, type, rayYaw:r.yaw, rayY:r.y, R};
  if (target === 'panel'){ grab.yaw0 = panelPivot.rotation.y; grab.y0 = panelPivot.position.y; grab.s0 = S.pscale; }
  else { grab.yaw0 = dockPivot.rotation.y; grab.y0 = dock.mesh.position.y; }
}
function activeList(){
  const l = [];
  if (panel.mesh.visible) l.push(panel.mesh);
  l.push(dock.mesh);
  if (S.mode === 'shoot') l.push(...targets);
  else if (S.mode === 'gallery') l.push(...galleryItems);
  return l;
}
function interact(now, dt){
  const gazeOn = P.gaze === 1 || (P.gaze === 2 && S.stereo);
  let p = null, click = false, dwell = false, pinchDown = false, fistDown = false;
  if (tap){ p = S.stereo ? {x:0, y:0} : tap; click = true; tap = null; }
  else if (H.ok){ p = H.fist ? {x:H.px, y:H.py} : H; pinchDown = H.pinch && !wasPinch; fistDown = H.fist && !wasFist; click = pinchDown; }
  else if (gazeOn){ p = {x:0, y:0}; dwell = true; }
  const pinching = H.ok && H.pinch, fisting = H.ok && H.fist;
  wasPinch = pinching; wasFist = fisting;

  if (!p){                      // nothing is pointing (no hand, centre cursor off): hide the cursor and clear hover
    grab = null; cursor.visible = false; hoverKey = null; hoverT = 0;
    [panel, dock].forEach(u => { if (u.hover || u.press){ u.hover = null; u.press = null; u.dirty = true; } });
    activeList().forEach(o => { if (!o.userData.ui){ o.scale.x += (1 - o.scale.x)*0.3; o.scale.y = o.scale.z = o.scale.x; } });
    return;
  }
  cursor.visible = true;
  ray.setFromCamera(p, camera);

  // --- dragging the panel / dock, or resizing the panel ---
  if (grab){
    const alive = grab.kind === 'fist' ? fisting : pinching;
    const gu = grab.target === 'dock' ? dock : panel;
    if (!alive){
      grab = null;
      [panel, dock].forEach(u => { u.hover = null; u.press = null; u.dirty = true; });
    } else {
      const r = rayYawY(grab.R);
      if (grab.type === 'resize'){
        const w0 = BASE_W*grab.s0, h0 = BASE_H*grab.s0;
        const dx = (r.yaw - grab.rayYaw)*grab.R, dy = r.y - grab.rayY;
        S.pscale = clamp(grab.s0 * (1 + 0.5*(dx/(w0/2) - dy/(h0/2))), PS_MIN, PS_MAX);
      } else if (grab.target === 'panel'){
        panelPivot.rotation.y = grab.yaw0 - (r.yaw - grab.rayYaw);
        panelPivot.position.y = clamp(grab.y0 + (r.y - grab.rayY), -0.5, 1.0);
      } else {
        dockPivot.rotation.y = grab.yaw0 - (r.yaw - grab.rayYaw);
        dock.mesh.position.y = clamp(grab.y0 + (r.y - grab.rayY), -1.1, 0.5);
      }
      const hid = grab.type === 'resize' ? 'resize' : (grab.target === 'dock' ? 'dockbg' : 'grab');
      if (gu.hover !== hid){ gu.hover = hid; gu.press = hid; gu.dirty = true; }
      ray.ray.at(grab.R, cursor.position);
      cursor.material.color.set(0x39e08a); cursor.scale.setScalar(1);
      return;
    }
  }

  const list = activeList();
  const hit = ray.intersectObjects(list, false)[0];
  const obj = hit ? hit.object : null;
  const ui = obj && obj.userData.ui ? obj.userData.ui : null;
  const reg = ui ? ui.at(hit.uv) : null;

  [panel, dock].forEach(u => {
    const h = (u === ui && reg) ? reg.id : null;
    const pr = (h && pinching) ? h : null;
    if (u.hover !== h || u.press !== pr){ u.hover = h; u.press = pr; u.dirty = true; }
  });

  list.forEach(o => {
    if (o.userData.ui) return;
    const s = (o === obj) ? 1.12 : 1;
    o.scale.x += (s - o.scale.x)*0.3; o.scale.y = o.scale.z = o.scale.x;
  });

  // a fist closed anywhere over the panel or dock grabs it
  if (fistDown && ui) startGrab('fist', ui === dock ? 'dock' : 'panel', 'move');

  const fn = ui ? (reg && reg.fn) : (obj && obj.userData.onClick);
  const key = (obj && (ui ? (reg && reg.fn ? obj.id + ':' + reg.id : null) : String(obj.id))) || null;
  if (dwell){
    if (key && key === hoverKey) hoverT += dt; else hoverT = 0;
    if (key && hoverT > 1.0){ click = true; hoverT = 0; }
  } else hoverT = 0;
  hoverKey = key;

  if (click && now > cool && !grab){
    if (pinchDown && ui === panel && reg && reg.id === 'grab') startGrab('pinch', 'panel', 'move');
    else if (pinchDown && ui === panel && reg && reg.id === 'resize') startGrab('pinch', 'panel', 'resize');
    else if (pinchDown && ui === dock && reg && reg.id === 'dockbg') startGrab('pinch', 'dock', 'move');
    else if (fn){ cool = now + 350; fn(); }
  }

  if (hit) cursor.position.copy(hit.point).addScaledVector(ray.ray.direction, -0.03);
  else ray.ray.at(PANEL_R, cursor.position);
  cursor.material.color.set(H.ok ? (H.pinch ? 0x39e08a : (H.fist ? 0x4f8cff : 0xffffff)) : 0xffd24a);
  cursor.scale.setScalar(1 + hoverT*2);
}

/* ---------- loop ---------- */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = (S.stereo ? w/2 : w) / h;
  camera.updateProjectionMatrix();
  hud.style.display = S.stereo ? 'none' : 'block';
}
function render(){
  const w = innerWidth, h = innerHeight;
  if (S.stereo){
    camera.updateMatrixWorld(); stereo.eyeSep = S.ipd; stereo.update(camera);
    renderer.setScissorTest(true);
    renderer.setViewport(0, 0, w/2, h); renderer.setScissor(0, 0, w/2, h); renderer.render(scene, stereo.cameraL);
    renderer.setViewport(w/2, 0, w/2, h); renderer.setScissor(w/2, 0, w/2, h); renderer.render(scene, stereo.cameraR);
    renderer.setScissorTest(false);
  } else {
    renderer.setViewport(0, 0, w, h); renderer.render(scene, camera);
  }
}
let last = 0, fpsN = 0, fpsT = 0, lowT = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now - last)/1000, 0.1); last = now;
  if (N.webOpen) return;                 // the browser overlay covers the scene: pause the 3D work
  camera.quaternion.copy(devQ); camera.updateMatrixWorld(true);
  updateLight(now);
  if (N.boosting && S.mr && video.currentTime !== N.drawnVT) boostFrame();
  updateHands(now);
  easeCursor(dt);
  interact(now, dt);
  syncPanelGeo();
  updateHandViz();
  if (toast.mesh.visible){
    if (now > N.msgUntil) toast.mesh.visible = false;
    else toast.mesh.position.set(0, dock.mesh.position.y + 0.24, -DOCK_R + 0.02);
  }
  [panel, dock, toast].forEach(u => { if (u.dirty && u.mesh.visible && now - (u.lastDraw || 0) > 90){ u.lastDraw = now; u.redraw(); } });

  if (S.mode === 'shoot'){
    spawnAcc += dt; if (spawnAcc > 1.1){ spawnAcc = 0; spawnTarget(); }
    targets.slice().forEach(t => { if (now - t.userData.born > 7000) popTarget(t); });
  } else if (S.mode === 'gallery'){
    galleryItems.forEach(m => { m.rotation.y += dt*m.userData.spd; m.rotation.x += dt*0.3*m.userData.spd; });
  }
  render();

  fpsN++; fpsT += dt;
  if (fpsT > 0.5){
    hud.textContent = VERSION + ' | ' + Math.round(fpsN/fpsT) + ' fps | hand: ' + (H.ok ? (H.fist ? 'fist' : (H.pinch ? 'pinch' : 'ok')) : 'none') + ' (' + delegate + ', det ' + D.ms.toFixed(0) + 'ms/' + (detGap ? Math.round(1000/Math.max(detGap,1)) : 0) + 'Hz)\nmode: ' + S.mode + ' | q: ' + QNAMES[S.qi] + ' | ui x' + S.pscale.toFixed(2) + '\nlight ' + Math.round(N.lum) + ' x' + N.gain.toFixed(1) + (N.torchOn ? ' | torch' : '') + (gotOrient ? '' : ' | no gyro');
    const fpsNow = fpsN/fpsT;
    if (fpsNow < 20 && S.qi > 0 && S.cam !== undefined){ lowT += 0.5; if (lowT >= 2.5){ S.qi--; applyQuality(); savePrefs(); invalidateUI(); lowT = 0; } } else lowT = 0;
    fpsN = 0; fpsT = 0;
  }
}

/* ---------- start ---------- */
addEventListener('resize', resize);

// browser overlay buttons
$('wgo').onclick = () => openWeb($('wurl').value);
$('wurl').addEventListener('keydown', e => { if (e.key === 'Enter') openWeb($('wurl').value); });
$('wh').onclick = () => { if (N.webUrl) $('wframe').src = N.webUrl; };
$('wx').onclick = () => { window.open($('wurl').value || N.webUrl, '_blank', 'noopener'); };
$('wc').onclick = closeWeb;

// a real touch right after a hand-triggered launch lets Chrome follow the Android link
document.addEventListener('pointerdown', () => {
  if (!N.pending) return;
  const u = N.pending; N.pending = null; N.swallow = true;
  setTimeout(() => { N.swallow = false; }, 80);
  window.location.href = u;
}, true);

// coming back from another app: restart the camera and screen lock
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !S.cam) return;
  try{ if (N.track && N.track.readyState === 'ended') await initCamera(); else await video.play(); }catch(e){}
  try{ if (navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){}
});
$('go').onclick = async () => {
  $('msg').textContent = 'กำลังเริ่ม...';
  try{ if (DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); }catch(e){}
  addEventListener('deviceorientation', onOrient, true);
  try{ await document.documentElement.requestFullscreen(); await screen.orientation.lock('landscape'); }catch(e){}
  try{ if (navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){}
  await initCamera();
  initHands();
  $('start').remove();
  groups.shoot.visible = false; groups.gallery.visible = false; panel.mesh.visible = true;
  applyQuality(); recenterHeading(); drawScore(); invalidateUI();
  requestAnimationFrame(frame);
};
